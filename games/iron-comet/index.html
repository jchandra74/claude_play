<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Iron Comet</title>
<style>

    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  #c {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges; display: block;
  }
  /* Touch layer: a slide d-pad zone on the left, A/B zone on the right. Graphics are tiny canvases scaled up pixelated. */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 2; }
  #touch.on { display: block; }
  #touch canvas { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; opacity: 0.82; }
  .zone { position: absolute; pointer-events: auto; touch-action: none; }
  #padZone { left: 0; bottom: 0; width: 42%; height: 78%; }
  #btnZone { right: 0; bottom: 0; width: 42%; height: 78%; }
  #sysZone { left: 40%; bottom: 0; width: 120px; height: 56px; }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: #0b0714; color: #ffd47a; font: 700 16px/1.4 monospace; text-align: center; padding: 16px; z-index: 5;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<div id="touch">
  <canvas id="padC" width="48" height="48"></canvas>
  <canvas id="btnA" width="30" height="30"></canvas>
  <canvas id="btnB" width="30" height="30"></canvas>
  <canvas id="btnP" width="16" height="16"></canvas>
  <canvas id="btnM" width="16" height="16"></canvas>
  <div class="zone" id="padZone"></div>
  <div class="zone" id="btnZone"></div>
  <div class="zone" id="sysZone"></div>
</div>
<div id="rotate"><div style="font-size:40px">&#8635;</div>Turn your phone sideways<br>to ride the Iron Comet</div>

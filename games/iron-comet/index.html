<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Iron Comet</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  #c {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges; display: block;
  }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  .tb {
    position: absolute; pointer-events: auto; touch-action: none;
    width: 64px; height: 64px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35); background: rgba(20,10,30,0.35);
    color: rgba(255,255,255,0.8); font: 700 13px/60px monospace; text-align: center;
  }
  .tb.down { background: rgba(255,210,120,0.45); border-color: rgba(255,230,160,0.9); color: #fff; }
  #bL { left: max(14px, env(safe-area-inset-left)); bottom: 86px; }
  #bR { left: calc(max(14px, env(safe-area-inset-left)) + 76px); bottom: 86px; }
  #bD { left: calc(max(14px, env(safe-area-inset-left)) + 38px); bottom: 14px; }
  #bK { right: calc(max(14px, env(safe-area-inset-right)) + 80px); bottom: 26px; width: 72px; height: 72px; line-height: 68px; }
  #bJ { right: max(14px, env(safe-area-inset-right)); bottom: 74px; width: 72px; height: 72px; line-height: 68px; }
  #bP { right: max(10px, env(safe-area-inset-right)); top: 10px; width: 40px; height: 40px; line-height: 36px; border-radius: 10px; font-size: 12px; }
  #rotate {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: #0b0714; color: #ffd47a; font: 700 16px/1.4 monospace; text-align: center; padding: 16px; z-index: 5;
  }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<div id="touch">
  <div class="tb" id="bL" data-k="left">&#9664;</div>
  <div class="tb" id="bR" data-k="right">&#9654;</div>
  <div class="tb" id="bD" data-k="down">&#9660;</div>
  <div class="tb" id="bK" data-k="kick">KICK</div>
  <div class="tb" id="bJ" data-k="jump">JUMP</div>
  <div class="tb" id="bP" data-k="pause">II</div>
</div>
<div id="rotate"><div style="font-size:40px">&#8635;</div>Turn your phone sideways<br>to ride the Iron Comet</div>

class PixBuf {
  constructor(w, h) { this.w = w; this.h = h; this.cv = mk(w, h); this.g = this.cv.getContext('2d'); this.img = this.g.createImageData(w, h); this.d = new Uint32Array(this.img.data.buffer); this.m = new Uint8Array(w * h); }
  clear() { this.d.fill(0); }
  px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= this.w || y >= this.h) return; this.d[y * this.w + x] = c; }
  sq(x, y, s, c) { const o = (s - 1) >> 1; x = Math.round(x) - o; y = Math.round(y) - o; for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) this.px(x + i, y + j, c); }
  line(x0, y0, x1, y1, c, s = 1) {
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;
    for (let i = 0; i < 200; i++) { this.sq(x0, y0, s, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  }
  disc(cx, cy, r, c) { for (let dy = -Math.ceil(r); dy <= r; dy++) for (let dx = -Math.ceil(r); dx <= r; dx++) if (dx * dx + dy * dy <= r * r + r * 0.7) this.px(cx + dx, cy + dy, c); }
  outline(c) {
    const { w, h, d, m } = this;
    for (let i = 0; i < d.length; i++) m[i] = d[i] ? 1 : 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (m[i]) continue;
      if ((x > 0 && m[i - 1]) || (x < w - 1 && m[i + 1]) || (y > 0 && m[i - w]) || (y < h - 1 && m[i + w])) d[i] = c;
    }
  }
  fill(c) { const d = this.d; for (let i = 0; i < d.length; i++) if (d[i]) d[i] = c; }

}

/* Head & hat details per character kind. Coordinates are in the sprite buffer. */
function drawHead(B, r, hx, hy, f, t, opts) {
  const R = r.hr;
  B.disc(hx, hy, R, r.c_skin);
  const fx = (dx) => hx + dx * f;
  switch (r.kind) {
    case 'hero':
      for (let dx = -R; dx <= R; dx++) for (let dy = -R - 1; dy <= -1; dy++) if (dx * dx + (dy + 0.5) * (dy + 0.5) <= R * R + 1) B.px(hx + dx, hy + dy, r.c_hat);
      B.px(fx(-R - 1), hy - 1, r.c_hat); B.px(fx(-R), hy, r.c_hat);
      B.px(fx(1), hy - 1, r.c_acc); B.px(fx(2), hy - 1, r.c_acc); B.px(fx(0), hy - 1, C32('#ffffff'));
      B.px(fx(2), hy + 1, r.c_skinD);
      break;
    case 'thug':
      for (let dx = -R; dx <= R; dx++) { B.px(hx + dx, hy - R, r.c_hat); B.px(hx + dx, hy - R + 1, r.c_hat); }
      B.px(fx(-R - 1), hy - R + 1, r.c_hat); B.px(fx(-R - 2), hy - R + 2, r.c_hat); B.px(fx(-R - 1), hy - R + 3, r.c_hat);
      B.px(fx(1), hy, OUTLINE); B.px(fx(2), hy + 2, r.c_hair); B.px(fx(1), hy + 2, r.c_hair); B.px(fx(0), hy + 3, r.c_hair);
      break;
    case 'slick':
      for (let dx = -R - 1; dx <= R + 1; dx++) B.px(hx + dx, hy - R + 1, r.c_hat);
      for (let dx = -R + 1; dx <= R - 1; dx++) for (let dy = -R - 2; dy <= -R; dy++) B.px(hx + dx, hy + dy, r.c_hat);
      B.px(fx(1), hy, OUTLINE); B.px(fx(1), hy + 1, r.c_hair); B.px(fx(2), hy + 1, r.c_hair); B.px(fx(3), hy + 2, r.c_hair); B.px(fx(0), hy + 1, r.c_hair);
      break;
    case 'brute':
      B.px(fx(1), hy - 1, OUTLINE); B.px(fx(2), hy - 1, OUTLINE);
      for (let dx = -1; dx <= 2; dx++) B.px(fx(dx), hy + 2, r.c_hair);
      B.px(fx(-R), hy, r.c_skinD); B.px(fx(-1), hy - R, C32('#ffffff'));
      break;
    case 'boss':
      for (let dx = -R - 2; dx <= R + 2; dx++) B.px(hx + dx, hy - R + 1, r.c_hat);
      for (let dx = -R + 1; dx <= R - 1; dx++) for (let dy = -R - 6; dy <= -R; dy++) B.px(hx + dx, hy + dy, dy === -R - 1 ? C32('#a8182c') : r.c_hat);
      B.px(fx(1), hy - 1, OUTLINE); B.px(fx(2), hy - 1, C32('#ffffff')); B.px(fx(1), hy - 2, OUTLINE); B.px(fx(2), hy - 2, OUTLINE);
      for (let dx = -2; dx <= 4; dx++) B.px(fx(dx), hy + 1 + (Math.abs(dx - 1) > 2 ? -1 : 0), r.c_hair);
      B.px(fx(4), hy, r.c_hair); B.px(fx(-2), hy, r.c_hair);
      B.px(fx(3), hy + 3, r.c_hair); B.px(fx(2), hy + 3, r.c_hair); B.px(fx(2), hy + 4, r.c_hair);
      break;

}

    } else if (s.type === 'tender') {

      for (const bx of [x + 18, x + s.w - 18]) { rect(bx - 12, 152, 24, 4, '#2a2228'); drawWheel(bx - 7, 157, 5, ang, '#5a5460'); drawWheel(bx + 7, 157, 5, ang + 1, '#5a5460'); }
      rect(x, 118, s.w, 32, '#2a2a34'); rect(x, 118, s.w, 2, '#4a4a58'); rect(x, 144, s.w, 4, '#1a1a22');
      rect(x + 4, 126, s.w - 8, 12, '#22222c'); text('IC', x + s.w / 2, 129, '#e8c050', { align: 'center' });
      for (let k = 0; k < s.w; k++) { const hgt = 6 + Math.sin(k * 0.5) * 1.5 + hash(k) * 2; rect(x + k, 118 - hgt, 1, hgt, k % 3 ? '#1a1820' : '#2a2832'); if (hash(k * 5) < 0.2) rect(x + k, 118 - hgt, 1, 1, '#6a6478'); }
    } else if (s.type === 'cab') {
      rect(x - 2, 96, s.w + 4, 3, '#2a2228'); rect(x - 2, 96, s.w + 4, 1, '#5a5262');
      rect(x, 99, s.w, 50, '#1e2a3a'); rect(x, 99, 2, 50, '#3a4a5e');
      rect(x + 8, 104, 22, 16, '#0e0e14'); rect(x + 9, 105, 20, 14, S.mode === 'brake' || S.mode === 'clear' ? '#3a2a20' : (night ? '#ff9040' : '#4a3a30'));
      if (S.mode === 'brake' || S.mode === 'clear') { const lx = x + 18, ly = 118, la = S.mode === 'clear' ? -0.9 : lerp(0.6, -0.9, Math.min(1, S.brakeT * 2)); pline(lx, ly, lx + Math.sin(la) * 9, ly - Math.cos(la) * 9, '#c8c8d0'); rect(lx + Math.sin(la) * 9 - 1, ly - Math.cos(la) * 9 - 1, 3, 3, '#ff3030');
        drawRig(RIGS.hero, POSE.brace(S.t), x + 12, 119, 1, { scarf: null, t: S.t }); }
      rect(x, 132, s.w, 2, '#e8c050');
    } else if (s.type === 'boiler') {

      pline(wxs[2] + cx, 152 + cy, x + 92, 146, '#a8a8b8'); rect(x + 86, 142, 14, 8, '#3a3a48');
      // boiler barrel

      for (let bx = x + 14; bx < x + s.w - 10; bx += 22) rect(bx, by, 2, 30, '#c89838');
      rect(x + s.w - 14, by - 2, 10, 34, '#16161e'); pcirc(x + s.w - 6, by + 15, 4, '#2a2a34');
      // chimney, domes
      rect(x + s.w - 28, 96, 10, 22, '#16161e'); rect(x + s.w - 30, 92, 14, 5, '#22222c'); rect(x + s.w - 30, 92, 14, 1, '#4a4a5c');
      pcirc(x + 50, by - 2, 5, '#c89838'); rect(x + 45, by - 2, 11, 3, '#c89838'); rect(x + 47, by - 6, 2, 2, '#ffe080');
      pcirc(x + 24, by - 1, 4, '#22222e');
      // headlamp & cowcatcher

      if (st.night) { for (let k = 0; k < 60; k++) { const yy = by - 6 - k * 0.15, hh = 2 + k * 0.5; rect(x + s.w + k, yy - hh / 2, 1, hh, dpat('#fff0b0', 0.35 - k * 0.005)); } }

  }
}
function drawEntities() {
  const p = player;
  // pickups
  for (const k of S.pickups) { const x = Math.round(k.x - S.camX), y = Math.round(k.y + Math.sin(k.t * 4) * 2); if (x < -10 || x > W + 10) continue;
    if (k.type === 'heart') { drawHeart(x - 3, y - 3, '#ff4060'); }
    else { const w = Math.abs(Math.cos(k.t * 3)) * 4 + 1 | 0; rect(x - w, y - 3, w * 2, 7, '#1a1010'); rect(x - w + 1, y - 2, w * 2 - 2, 5, '#ffd040'); if (w > 2) rect(x - w + 2, y - 1, w * 2 - 4, 1, '#fff8c0'); } }
  // enemies
  for (const e of S.ents) {
    if (e.state === 'dead') continue;
    const sx = e.x - S.camX, sy = e.y; if (sx < -40 || sx > W + 40) continue;
    if (e.type === 'crow') { drawCrow(sx, sy, e.t, -1, e.flash > 0); if (e.state === 'flying') {} continue; }
    if (e.state === 'hidden') continue;
    const rig = RIGS[e.type]; let pose, item = null;
    switch (e.state) {
      case 'climb': pose = POSE.climb(e.t); break;
      case 'active': pose = (e.type === 'slick' ? POSE.idle(e.t) : POSE.run(e.ph)); if (e.type === 'slick') item = 'knife'; if (e.type !== 'slick' && Math.abs(player.x - e.x) < 16) pose = POSE.idle(e.t); break;
      case 'windup': pose = POSE.windup(e.t); break;
      case 'punch': pose = POSE.punch(e.t); break;
      case 'stun': pose = POSE.hurt(e.t); break;
      case 'aim': pose = e.hi ? POSE.throwHi(e.t) : POSE.throwLo(e.t); item = 'knife'; break;
      case 'throw': pose = POSE.release(e.t); break;
      case 'chargeup': pose = POSE.windup(e.t); pose.lean = 0.5; break;
      case 'charge': pose = POSE.charge(e.ph); break;
      case 'flying': pose = POSE.tumble(e.rot); break;
      default: pose = POSE.idle(e.t);
    }
    if (e.state === 'climb') { ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, ROOF + 1); ctx.clip(); drawRig(rig, pose, sx, sy, e.f, { t: e.t, item, flash: e.flash > 0 }); ctx.restore(); }
    else drawRig(rig, pose, sx, sy, e.f, { t: e.t, item, flash: e.flash > 0 ? 1 : (e.state === 'windup' || e.state === 'chargeup' || e.state === 'aim') && Math.floor(e.t * 16) % 2 ? 2 : 0 });
    if (e.state === 'aim' && Math.floor(e.t * 10) % 2) { rect(sx + e.f * 6, sy - (e.hi ? 20 : 7), 2, 2, '#ffffff'); }
  }
  // boss

    const sx = b.x - S.camX; let pose;
    switch (b.state) { case 'intro': pose = POSE.taunt(b.t); break; case 'throw': pose = b.t < 0.25 ? POSE.throwHi(b.t) : POSE.release(b.t); break;
      case 'leapup': pose = POSE.duck(b.t); break; case 'leap': pose = POSE.jump(); break; case 'land': pose = POSE.duck(b.t); break;
      case 'chargeup': pose = POSE.windup(b.t); pose.lean = 0.6; break; case 'charge': pose = POSE.charge(b.ph); break;
      case 'stagger': pose = POSE.hurt(b.t); break; case 'flying': pose = POSE.tumble(b.rot); break; default: pose = POSE.idle(b.t); }
    drawRig(RIGS.boss, pose, sx, b.y, b.f, { t: b.t, item: b.state === 'throw' && b.t < 0.25 ? 'coal' : null, flash: b.flash > 0 ? 1 : (b.state === 'chargeup' || b.state === 'leapup') && Math.floor(b.t * 16) % 2 ? 2 : 0 });
  }
  // player
  if (!p.gone || S.mode === 'dying') {
    if (!(p.inv > 0 && Math.floor(S.t * 20) % 2 && S.mode === 'play' && p.hurt <= 0)) {
      let pose;
      const sx = p.x - S.camX;
      if (S.mode === 'dying') pose = POSE.tumble(S.dieT * 9);
      else if (p.state === 'gap') pose = POSE.fall(p.t);
      else if (p.hurt > 0) pose = POSE.hurt(p.t);
      else if (!p.ground) pose = p.akick > 0 ? POSE.airkick() : p.vy < 0 ? POSE.jump() : POSE.fall(p.t);
      else if (p.kick > 0) pose = p.duck ? POSE.sweep() : POSE.kick(0.3 - p.kick);
      else if (p.duck) pose = Math.abs(p.vx) > 10 && (keys.left || keys.right) ? POSE.crawl(p.t * 10) : POSE.duck(p.t);
      else if (Math.abs(p.vx) > 30 && (keys.left || keys.right)) { p.ph += 0.016 * 13 * (p.vx * p.f > 0 ? 1 : 1); pose = p.vx * p.f > 0 ? POSE.run(p.ph) : POSE.back(p.ph); }
      else pose = POSE.brace(p.t);
      drawRig(RIGS.hero, pose, sx, p.y, p.f, { scarf: p.scarf.map(q => [q.x - S.camX, q.y]), t: p.t, flash: p.hurt > 0.3 ? 1 : 0 });
    }

    else if (s.type === 'coal') { pcirc(x, y, 3, '#140c1c'); pcirc(x, y, 2, '#3a3040'); rect(x - 1, y - 1, 1, 1, '#8a7a90'); if (Math.floor(S.t * 20) % 2) rect(x + 1, y + 1, 1, 1, '#ff8040'); }
    else if (s.type === 'wave') { for (let k = 0; k < 7; k++) rect(x - 3 + (k % 3), y - k, 6 - (k % 3) * 2, 1, k % 2 ? '#ffd070' : '#ff8040'); }
  }
}
function drawHeart(x, y, c) {
  const m = ['.##.##.', '#######', '#######', '.#####.', '..###..', '...#...'];
  for (let j = 0; j < m.length; j++) for (let i = 0; i < 7; i++) if (m[j][i] === '#') rect(x + i, y + j, 1, 1, c);
  rect(x + 1, y + 1, 1, 1, '#ffffff');
}
function drawParticles() {
  for (const q of S.parts) { const x = q.x - S.camX, y = q.y, k = q.life / q.max;
    if (q.type === 'smoke') { const r = Math.round(q.r + k * 8); pcirc(x, y, r, dpat(stageDef().night ? '#5a5a6a' : '#e8e0e0', 0.85 - k * 0.8)); pcirc(x - 1, y - 1, Math.max(1, r - 2), dpat('#ffffff', 0.5 - k * 0.5)); }
    else rect(x, y, q.s, q.s, q.col); }
}
function drawRain() {
  const st = stageDef(); if (!st.rain) return;
  for (let i = 0; i < 90; i++) { const sp = 1 + hash(i) * 0.6; const x = ((hash(i * 7) * W * 1.5 - S.t * 380 * sp) % (W * 1.5) + W * 1.5) % (W * 1.5); const y = ((hash(i * 13) * H + S.t * 260 * sp) % H); pline(x, y, x - 5, y + 4, i % 3 ? '#8a9ab8' : '#c8d4e8'); }
  if (S.lightning > 0) { drect(0, 0, W, H, '#ffffff', S.lightning * 2.5); }
}
function drawHUD() {
  rect(0, 0, W, 14, dpat('#0a0610', 0.75));
  for (let i = 0; i < S.maxHearts; i++) drawHeart(4 + i * 9, 4, i < S.hearts ? '#ff4060' : '#3a2030');
  text('SCORE ' + String(S.score).padStart(7, '0'), 56, 4, '#ffffff', { shadow: '#000000' });
  text('HI ' + String(Math.max(HI, S.score)).padStart(7, '0'), 160, 4, '#ffd070', { shadow: '#000000' });
  if (S.combo > 1 && S.comboT > 0) text('X' + Math.min(8, S.combo), 250, 4, Math.floor(S.t * 10) % 2 ? '#ffd040' : '#ff8040', { shadow: '#000' });
  // bridge-out meter
  const left = clamp(1 - S.trainDist / S.bridgeOut, 0, 1);
  rect(W - 56, 5, 50, 4, '#2a2030'); rect(W - 56, 6, 50, 2, '#4a3a50');
  const mx = W - 56 + Math.round((1 - left) * 46);

  rect(W - 6, 2, 2, 9, '#ff4040'); rect(W - 4, 2, 2, 2, '#ff4040');
  // train position (where the hero is along the train)
  if (S.mode === 'play' && !S.bossOn) { const pr = clamp(player.x / S.tender.x, 0, 1); rect(4, 172, 100, 3, dpat('#000000', 0.6)); for (const s of S.segs) if (s.type === 'car') rect(4 + s.x / S.tender.x * 100, 173, Math.max(1, s.w / S.tender.x * 100 - 1), 1, '#6a6070'); rect(104, 172, 4, 3, '#e8c050'); rect(4 + pr * 100, 171, 2, 5, '#4ae0ff'); }
  if (S.boss && S.boss.hp > 0) { rect(80, 166, 160, 8, '#140c1c'); rect(81, 167, 158, 6, '#3a1020'); rect(81, 167, Math.round(158 * S.boss.hp / S.boss.maxhp), 6, '#e83040'); rect(81, 167, Math.round(158 * S.boss.hp / S.boss.maxhp), 1, '#ff9090'); text('BARON BOXCAR', 160, 157, '#ffd070', { align: 'center', outline: '#140c1c' }); }
  for (const pp of S.pops) text(pp.s, pp.x - S.camX, pp.y - pp.t * 18, pp.t < 0.8 || Math.floor(pp.t * 20) % 2 ? '#ffffff' : '#ffd040', { align: 'center', outline: '#140c1c' });
}
function drawBanner() {
  const b = S.banner; if (!b) return;
  const t = b.t, k = t < 0.3 ? t / 0.3 : t > 2.6 ? (3 - t) / 0.4 : 1;
  const hh = Math.round(36 * k);
  rect(0, 70 - hh / 2, W, hh, dpat('#0a0610', 0.85));
  if (k > 0.8) {
    text(b.a, W / 2, 56, b.boss ? '#ff6050' : '#ffd070', { align: 'center', s: 2, outline: '#140c1c' });
    text(b.b, W / 2, 75, '#ffffff', { align: 'center', outline: '#140c1c' });
    if (b.c) text(b.c, W / 2, 86, Math.floor(t * 4) % 2 ? '#ff8060' : '#ffd070', { align: 'center', outline: '#140c1c' });

}
function drawTitle() {
  const t = S.t;

  const g = ['#fff6d0', '#ffe080', '#ffc040', '#ff9030', '#ff6030', '#e03838', '#a02040'];
  const bob = Math.round(Math.sin(t * 2) * 1.5);
  text('IRON', W / 2, 26 + bob, '#ffd070', { align: 'center', s: 3, grad: g, outline: '#140c1c' });
  text('COMET', W / 2, 52 + bob, '#ffd070', { align: 'center', s: 3, grad: g, outline: '#140c1c' });
  text('THE RUNAWAY EXPRESS', W / 2, 78, '#9fe8ff', { align: 'center', outline: '#140c1c' });
  if (Math.floor(t * 2) % 2) text(isTouch ? 'TAP TO START' : 'PRESS ENTER', W / 2, 100, '#ffffff', { align: 'center', outline: '#140c1c' });
  text('HI ' + String(HI).padStart(7, '0'), W / 2, 4, '#ffd070', { align: 'center', outline: '#140c1c' });
  if (!isTouch) { text('ARROWS MOVE  Z JUMP  X KICK  v DUCK', W / 2, 168, '#ffffff', { align: 'center', outline: '#140c1c' }); }
  else text('JUMP  KICK  DUCK  -  STOP THE TRAIN', W / 2, 168, '#ffffff', { align: 'center', outline: '#140c1c' });
}
function drawTally() {
  const T = S.tally; rect(60, 40, 200, 100, dpat('#0a0610', 0.85)); rect(60, 40, 200, 1, '#ffd070'); rect(60, 139, 200, 1, '#ffd070');
  text('TRAIN STOPPED!', W / 2, 48, '#ffd070', { align: 'center', s: 2, outline: '#140c1c' });
  T.rows.forEach((r, i) => { if (i >= T.shown) return; text(r[0], 72, 72 + i * 12, '#ffffff'); text(String(r[2]), 248, 72 + i * 12, '#9fe8ff', { align: 'right' }); });
  if (T.added) { text('BONUS ' + T.total, W / 2, 112, '#ffd070', { align: 'center' }); if (T.t > 2.6 && Math.floor(S.t * 2) % 2) text(isTouch ? 'TAP FOR NEXT STAGE' : 'PRESS ENTER', W / 2, 126, '#ffffff', { align: 'center' }); }
}
function render() {
  ctx.save();
  if (S.shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * S.shake), Math.round((Math.random() - 0.5) * S.shake));
  drawBackdrop(); drawPoles(); drawTunnelBack(); drawGround(); drawTrain(); drawEntities(); drawHazardsFront(); drawParticles(); drawRain();

  if (S.mode === 'title') drawTitle();

    drawHUD(); drawBanner();
    if (S.mode === 'play') drawWarnings();
    if (S.mode === 'clear') drawTally();
    if (S.mode === 'crash') { drect(0, 0, W, H, '#ff3010', Math.min(0.7, S.crashT)); text('BRIDGE OUT!', W / 2, 74, '#ffffff', { align: 'center', s: 2, outline: '#140c1c' }); }
    if (S.mode === 'over') { rect(0, 60, W, 56, dpat('#0a0610', 0.85)); text('GAME OVER', W / 2, 66, '#ff6050', { align: 'center', s: 2, outline: '#140c1c' }); text('SCORE ' + S.score, W / 2, 88, '#ffffff', { align: 'center' }); if (S.newHi) text('NEW HIGH SCORE!', W / 2, 98, '#ffd070', { align: 'center' }); if (S.overT > 1.2 && Math.floor(S.t * 2) % 2) text(isTouch ? 'TAP TO RETRY' : 'PRESS ENTER', W / 2, 106, '#9fe8ff', { align: 'center' }); }
    if (S.paused) { rect(0, 0, W, H, dpat('#000000', 0.6)); text('PAUSED', W / 2, 80, '#ffffff', { align: 'center', s: 2 }); }
  }
}

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
function initTitle() {
  S.mode = 'title'; S.stage = 0; S.t = 0; S.titleT = 0; S.bd = buildBackdrop(STAGES[0], 100); S.speed = 230; S.targetSpeed = 230;
  buildTrain(); S.hazards = []; S.ents = []; S.pickups = []; S.bridgeOut = 1e9;
  Object.assign(player, { x: 140, y: ROOF, f: 1, ground: true, gone: false, state: 'run', inv: 0, hurt: 0, kick: 0, akick: 0, duck: false });
  player.scarf = []; for (let i = 0; i < 7; i++) player.scarf.push({ x: 140 - i * 2, y: ROOF - 17, px: 140 - i * 2, py: ROOF - 17 });
  playSong('title');
}
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; acc += dt;
  const STEP = 1 / 60; let n = 0;
  while (acc >= STEP && n < 4) { if (S.mode === 'title') { updatePlayerTitle(STEP); } update(STEP); acc -= STEP; n++; }
  if (n === 4) acc = 0;
  musicTick();
  render();
  requestAnimationFrame(frame);
}
function updatePlayerTitle(dt) {
  const p = player; p.t += dt; const sc = p.scarf; sc[0].x = p.x - 1; sc[0].y = p.y - 18;
  for (let i = 1; i < sc.length; i++) { const q = sc[i]; const vx = (q.x - q.px) * 0.86, vy = (q.y - q.py) * 0.86; q.px = q.x; q.py = q.y; q.x += vx - (S.speed * 0.9 + 40) * dt * dt * 30 + Math.sin(S.t * 30 + i) * 0.25; q.y += vy + 30 * dt * dt * 60 + Math.cos(S.t * 23 + i * 1.7) * 0.35 * (i / sc.length); }
  for (let k = 0; k < 3; k++) for (let i = 1; i < sc.length; i++) { const a = sc[i - 1], b = sc[i]; const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, df = (d - 2.2) / d; b.x -= dx * df; b.y -= dy * df; }
}
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') S.paused = true; });

// debug hooks for automated screenshots
window.IC = { S, player, startStage: (n) => { S.stage = n; S.score = 0; S.hearts = 5; startStage(); }, newGame, boss: () => { player.x = S.tender.x - GAP - 50; S.camX = player.x - 110; }, keys, pressed };

initTitle();
if (QS.has('stage')) { S.stage = +QS.get('stage') || 0; S.hearts = 5; startStage(); }
requestAnimationFrame(frame);
})();

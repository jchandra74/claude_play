}

/* ---------- resolving actions ---------- */
function calcDmg(attacker, target, power, stat, type) {
  const st = attacker[stat || 'atk'];
  let d = (st * 2.3 * power - target.def) * rand(0.9, 1.1);
  if (target.broken) d *= 2;
  if (target.weak && target.weak.includes(type)) d *= 1.3;
  if (target.defending) d *= 0.5;
  return Math.max(1, Math.round(d));
}

async function stepForward(a, d) { a.step = d; await sleepB(0.18); }

async function hitEnemy(a, e, power, stat, type, boostMul) {
  if (!e.alive) return;
  const isWeak = e.weak.includes(type);
  if (e.absorb === type) {
    const heal = Math.round(a[stat] * 2 * power * boostMul);
    e.hp = Math.min(e.maxHp, e.hp + heal);
    pop(e.x, e.y - 40, '+' + heal, UIC.green, true);
    pop(e.x, e.y - 52, 'ABSORBED', '#ffb04a');
    e.known[type] = 'absorb';
    sfx('fire');
    return;
  }
  const dmg = calcDmg(a, e, power * boostMul, stat, type);
  e.hp -= dmg;
  e.flash = 0.15; e.shake = 0.3;
  battle.shake = isWeak ? 3 : 1.5;
  spawnHitFx(e, type, isWeak);
  pop(e.x + rand(-8, 8), e.y - 30 - rand(0, 10), String(dmg), isWeak ? UIC.gold : '#fff', isWeak);
  if (isWeak) {
    e.known[type] = 'weak';
    if (!e.broken) {
      e.shield--;
      sfx('weak');
      if (e.shield <= 0) {
        e.shield = 0; e.broken = 1; e.brokenUntil = battle.round + 1;
        battle.breakFx = 1.2; battle.flash = 0.6; battle.shake = 6;
        sfx('break');
        breakShards(e);
        stats.breaks++;
      }
    } else sfx('hit');
  } else {
    if (!e.known[type]) e.known[type] = 'no';
    sfx('hit');
  }
  if (e.hp <= 0) { e.hp = 0; e.alive = false; e.dying = 1; sfx('die'); dissolve(e); }
}

async function doPartyAction(a, act) {
  const b = battle;
  const boost = act.boost || 0;
  if (boost) { b.bp[a.id] -= boost; b.boosted[a.id] = true; sfx('boost', 1 + boost * 0.3); burstBoost(a, boost); await sleepB(0.35); }
  a.defending = false;
  if (act.kind === 'defend') {
    a.defending = true;
    bmsg(`${a.name} braces for impact.`, 1);
    await sleepB(0.7);
    return;
  }
  if (act.kind === 'attack') {
    let t = act.target;
    const hitsN = 1 + boost;
    bmsg(`${a.name} attacks with the ${a.weapon === 'broom' ? 'Broom of Office' : 'slingshot'}!`, 1);
    await stepForward(a, 1);
    for (let i = 0; i < hitsN; i++) {
      if (!t.alive) { t = aliveEnemies()[0]; if (!t) break; }
      if (a.weapon === 'sling') sfx('sling');
      await hitEnemy(a, t, 1, 'atk', a.weapon, 1);
      await sleepB(0.24);
    }
    await sleepB(0.35);
    a.step = 0;
    return;
  }
  if (act.kind === 'skill') {
    const sk = act.skill, mul = [1, 2, 3, 4][boost];
    a.sp -= sk.sp;
    bmsg(`${a.name} uses ${sk.name}!` + (boost ? ` (Boost ×${boost})` : ''), 1.1);
    await stepForward(a, 1);
    if (sk.type === 'fire') sfx('fire');
    if (sk.type === 'sass') sfx('sass');
    if (sk.target === 'one') { await hitEnemy(a, act.target, sk.power, sk.stat, sk.type, mul); }
    else if (sk.target === 'all') { for (const e of aliveEnemies()) { await hitEnemy(a, e, sk.power, sk.stat, sk.type, mul); await sleepB(0.12); } }
    else if (sk.target === 'random3') {
      for (let i = 0; i < 3 + boost; i++) { const al = aliveEnemies(); if (!al.length) break; sfx('sling'); await hitEnemy(a, pick(al), sk.power, sk.stat, sk.type, 1); await sleepB(0.2); }
    } else if (sk.type === 'heal') {
      const t = act.target, amt = Math.round(sk.power * mul);
      t.hp = Math.min(t.maxHp, t.hp + amt);
      sfx('heal'); healFx(t); pop(t.bx, t.by - 26, '+' + amt, UIC.green, true);
      if (Math.random() < 0.5) bmsg(pick(['"You\'re doing great. Like a sandwich."', '"Believe in yourself! Or in snacks!"', '"Remember: bread is just a sandwich that hasn\'t happened yet."']), 1.8);
    } else if (sk.type === 'nap') {
      const amt = Math.round(sk.power * mul);
      a.hp = Math.min(a.maxHp, a.hp + amt);
      sfx('heal'); healFx(a); pop(a.bx, a.by - 26, '+' + amt, UIC.green, true);
      bmsg('Moss lies down dramatically. Sighs. Feels better.', 1.6);
    }
    await sleepB(0.6);
    a.step = 0;
    return;
  }
  if (act.kind === 'item') {
    const it = ITEMS[act.key];
    inventory[act.key]--;
    bmsg(`${a.name} uses a ${it.name}!`, 1);
    await stepForward(a, 1);
    if (it.heal) { const t = act.target; t.hp = Math.min(t.maxHp, t.hp + it.heal); sfx('heal'); healFx(t); pop(t.bx, t.by - 26, '+' + it.heal, UIC.green, true); }
    if (it.sp) { const t = act.target; t.sp = Math.min(t.maxSp, t.sp + it.sp); sfx('heal'); healFx(t); pop(t.bx, t.by - 26, '+' + it.sp + ' SP', UIC.blue, true); }
    if (it.dmg) { sfx('fire'); for (const e of aliveEnemies()) { await hitEnemy({ atk: it.dmg / 2.3 + 0, mag: it.dmg / 2.3 }, e, 1, 'atk', it.type, 1); await sleepB(0.1); } }
    await sleepB(0.6);
    a.step = 0;
  }
}

async function enemyTurn(e) {
  const b = battle, d = e.def0;
  e.step = 1;
  /* Gerald's big telegraphed move */
  if (e.kind === 'gerald') {
    if (!e.enraged && e.hp < e.maxHp * 0.5) {
      e.enraged = true;
      bmsg('Gerald is getting EMOTIONAL! He flaps twice as fast!', 1.8);
      await sleepB(1.6);
    }
    if (e.telegraph) {
      e.telegraph = false;
      bmsg('DUST STORM! Gerald flaps with all his heart!', 1.2);
      sfx('whoosh');
      b.dust = 1.2;
      await sleepB(0.6);
      for (const p of aliveParty()) { enemyHit(e, p, 1.05); await sleepB(0.15); }
      await sleepB(0.7);
      e.step = 0;
      return;
    }
    if (Math.random() < (e.enraged ? 0.4 : 0.25)) {
      e.telegraph = true;
      bmsg('Gerald is winding up a really big flap! Break him before it lands!', 2);
      await sleepB(1.6);
      e.step = 0;
      if (e.enraged) return;
      return;
    }
  }
  const tot = d.moves.reduce((s, m) => s + m.w, 0);
  let r = Math.random() * tot, mv = d.moves[0];
  for (const m of d.moves) { r -= m.w; if (r <= 0) { mv = m; break; } }
  if (mv.heal && e.hp > e.maxHp * 0.8) mv = d.moves[0];
  const targets = aliveParty();
  const t = pick(targets);
  if (mv.heal) {
    e.hp = Math.min(e.maxHp, e.hp + mv.heal);
    sfx('heal'); pop(e.x, e.y - 40, '+' + mv.heal, UIC.green, true);
    bmsg(mv.line.replace(/\{e\}/g, e.name).replace('{n}', mv.heal), 1.8);
    await sleepB(1.4);
  } else if (!mv.power) {
    bmsg(mv.line.replace(/\{e\}/g, e.name), 2);
    await sleepB(1.8);
  } else {
    bmsg(mv.line ? mv.line.replace(/\{e\}/g, e.name).replace(/\{t\}/g, t.name) : `${e.name} uses ${mv.name}!`, 1.4);
    await sleepB(0.5);
    enemyHit(e, t, mv.power);
    await sleepB(0.9);
  }
  e.step = 0;
  /* emotional Gerald acts twice */
  if (e.kind === 'gerald' && e.enraged && !e.extra && aliveParty().length && !e.broken) {
    e.extra = true; await enemyTurn(e); e.extra = false;
  }
}
function enemyHit(e, p, power) {
  let dmg = Math.max(1, Math.round((e.atk * 2 * power - p.def) * rand(0.9, 1.1)));
  if (p.defending) dmg = Math.round(dmg * 0.5);
  p.hp = Math.max(0, p.hp - dmg);
  p.hurt = 0.3;
  battle.shake = 3; sfx('enemyAtk');
  pop(p.bx, p.by - 28, String(dmg), UIC.red, true);
  for (let i = 0; i < 8; i++) battle.fx.push({ kind: 'spark', x: p.bx, y: p.by - 12, vx: rand(-60, 60), vy: rand(-70, 10), t: 0, life: 0.4, col: [255, 120, 120] });
  if (p.hp <= 0) { pop(p.bx, p.by - 40, 'K.O.', '#ff8a8a'); }
}

async function victory() {
  const b = battle;
  audio.play('victory');
  const exp = b.enemies.reduce((s, e) => s + e.def0.exp, 0);
  bmsg('You won!', 2);
  stats.wins++;
  await sleepB(1.2);
  const lines = [];
  for (const p of b.active) {
    if (p.hp <= 0) p.hp = 1;
    p.exp += exp;
    while (p.exp >= 20 + p.lv * 6) {
      p.exp -= 20 + p.lv * 6; p.lv++;
      p.maxHp += 12; p.maxSp += 4; p.atk += 2; p.mag += 2; p.def += 1; p.spd += 1;
      p.hp = Math.min(p.maxHp, p.hp + 12);
      lines.push(p.id === 'pip'
        ? pick([`Pip reached level ${p.lv}! Pip feels slightly more like an adult.`, `Pip reached level ${p.lv}! Pip's broom technique is now "acceptable".`, `Pip reached level ${p.lv}! Pip can now name three types of cheese.`])
        : pick([`Moss reached level ${p.lv}. Moss is unimpressed.`, `Moss reached level ${p.lv}. Moss's sighs are now 20% more devastating.`]));
    }
  }
  await say(null, `Gained ${exp} EXP.`);
  for (const l of lines) { sfx('levelup'); await say(null, l); }
  if (b.opts.drop) { inventory[b.opts.drop] = (inventory[b.opts.drop] || 0) + 1; sfx('item'); await say(null, `Found a ${ITEMS[b.opts.drop].name}!`); }
  return 'win';
}

/* ---------- battle visuals ---------- */
function spawnHitFx(e, type, weak) {
  const col = type === 'fire' ? [255, 150, 60] : type === 'sass' ? [220, 140, 255] : type === 'sling' ? [200, 220, 255] : [255, 230, 140];
  for (let i = 0; i < (weak ? 18 : 10); i++) battle.fx.push({ kind: 'spark', x: e.x + rand(-6, 6), y: e.y - 16 + rand(-6, 6), vx: rand(-90, 90), vy: rand(-100, 30), t: 0, life: rand(0.3, 0.6), col });
  battle.fx.push({ kind: 'slash', x: e.x, y: e.y - 18, t: 0, life: 0.25, type, rot: rand(-0.6, 0.6) });
  if (type === 'fire') for (let i = 0; i < 14; i++) battle.fx.push({ kind: 'spark', x: e.x + rand(-10, 10), y: e.y - 6, vx: rand(-20, 20), vy: rand(-90, -40), t: 0, life: rand(0.4, 0.8), col: pick([[255, 200, 80], [255, 120, 40]]) });
}
function breakShards(e) {
  for (let i = 0; i < 26; i++) battle.fx.push({ kind: 'shard', x: e.x, y: e.y - 20, vx: rand(-160, 160), vy: rand(-180, 40), t: 0, life: rand(0.6, 1.1), rot: rand(0, TAU), vr: rand(-12, 12), s: rand(2, 5) });
}
function burstBoost(a, n) {
  for (let i = 0; i < 10 + n * 8; i++) battle.fx.push({ kind: 'spark', x: a.bx + rand(-8, 8), y: a.by, vx: rand(-20, 20), vy: rand(-90, -40), t: 0, life: rand(0.5, 0.9), col: n >= 3 ? [255, 120, 220] : n === 2 ? [255, 200, 80] : [120, 220, 255] });
}
function healFx(p) { for (let i = 0; i < 16; i++) battle.fx.push({ kind: 'spark', x: p.bx + rand(-10, 10), y: p.by + rand(-4, 4), vx: rand(-10, 10), vy: rand(-60, -30), t: 0, life: rand(0.6, 1), col: [140, 255, 160] }); }
function dissolve(e) {
  const spr = enemySprite(e);
  if (!spr) return;
  const fr = spr.frames[0];
  const x = fr.getContext('2d').getImageData(0, 0, fr.width, fr.height).data;
  for (let y = 0; y < fr.height; y += 2) for (let xx = 0; xx < fr.width; xx += 2) {
    const i = (y * fr.width + xx) * 4;
    if (x[i + 3] && Math.random() < 0.5) battle.fx.push({ kind: 'pix', x: e.x - fr.width / 2 + xx, y: e.y - fr.height + y, vx: rand(-20, 20), vy: rand(-50, -10), t: -Math.random() * 0.4 - (fr.height - y) / fr.height * 0.4, life: 1, col: [x[i], x[i + 1], x[i + 2]] });
  }
}
function enemySprite(e) { return e.kind === 'shrub' ? SPR.shrub : e.kind === 'moth' ? SPR.moth : SPR.gerald; }

/* Earthbound-style psychedelic battle background: a tiled pattern
   warped per scanline, two layers, palette-cycled */
let bgPat, bgPatX, bgStrip, bgStripX;
function initBattleBG() {
  [bgPat, bgPatX] = mk(64, 64);
}
function drawBattleBG(t, pal) {
  const id = bgPatX.createImageData(64, 64), d = id.data;
  const pals = [
    [[30, 20, 70], [60, 30, 120], [110, 50, 160], [60, 120, 190], [30, 60, 120]],
    [[60, 20, 30], [120, 40, 40], [200, 100, 50], [250, 180, 80], [120, 50, 70]],
  ][pal];
  for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) {
    const dx = x - 32, dy = y - 32;
    const v = (Math.floor(Math.hypot(dx, dy) / 4 + Math.atan2(dy, dx) / TAU * 8 + t * 3) % pals.length + pals.length) % pals.length;
    const c = pals[v];
    const i = (y * 64 + x) * 4;
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  bgPatX.putImageData(id, 0, 0);
  /* tile the pattern once into a wide strip, then copy one scanline per row */
  const sw = VW + 192;
  if (!bgStrip || bgStrip.width !== sw) [bgStrip, bgStripX] = mk(sw, 64);
  for (let x = 0; x < sw; x += 64) bgStripX.drawImage(bgPat, x, 0);
  const mod = v => ((v % 64) + 64) % 64;
  /* layer 1: horizontally warped scanlines */
  for (let y = 0; y < VH; y++) {
    const off = Math.sin(y * 0.06 + t * 1.6) * 14 + Math.sin(y * 0.021 - t * 0.7) * 10;
    L.drawImage(bgStrip, mod(Math.floor(off)), mod(y + Math.floor(t * 10)), VW, 1, 0, y, VW, 1);
  }
  /* layer 2: vertically compressed, interleaved, translucent */
  L.globalAlpha = 0.45;
  for (let y = 0; y < VH; y += 2) {
    const off = Math.sin(y * 0.09 - t * 2.2) * 20 + 32;
    L.drawImage(bgStrip, mod(Math.floor(off)), mod(Math.floor(y * 0.5 + Math.sin(t + y * 0.03) * 8)), VW, 1, 0, y, VW, 1);
  }
  L.globalAlpha = 1;
}

function renderBattle() {
  const b = battle;
  const t = world.t;
  const shake = b.shake > 0 ? rand(-b.shake, b.shake) : 0;
  L.setTransform(1, 0, 0, 1, Math.round(shake), 0);
  drawBattleBG(t, b.bgPal);
  /* darken toward the floor & spotlight pools */
  const g = L.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, 'rgba(10,6,24,0.35)'); g.addColorStop(0.5, 'rgba(10,6,24,0.55)'); g.addColorStop(1, 'rgba(10,6,24,0.9)');
  L.fillStyle = g; L.fillRect(-10, 0, VW + 20, VH);
  /* warm pools of light under everyone on stage */
  L.globalCompositeOperation = 'lighter';
  for (const e of b.enemies) if (e.alive) { const r = e.kind === 'gerald' ? 120 : 70; L.globalAlpha = 0.28; L.drawImage(lightSprite(b.bgPal ? [255, 150, 90] : [150, 130, 255]), e.x - r / 2, e.y - r * 0.42, r, r * 0.6); }
  for (const p of b.active) { L.globalAlpha = 0.3; L.drawImage(lightSprite([255, 200, 140]), p.bx - 30, p.by - 18, 60, 36); }
  L.globalAlpha = 1; L.globalCompositeOperation = 'source-over';
  E.clearRect(0, 0, VW, VH);
  E.setTransform(1, 0, 0, 1, Math.round(shake), 0);
  /* floor ellipses */
  for (const e of b.enemies) if (e.alive || e.dying > 0) { L.globalAlpha = 0.5; const w = e.kind === 'gerald' ? 70 : 34; L.drawImage(shadowSpr(w), e.x - w / 2, e.y - w * 0.19); L.globalAlpha = 1; }
  for (const p of b.active) { L.globalAlpha = 0.5; L.drawImage(shadowSpr(16), p.bx - 8, p.by - 3); L.globalAlpha = 1; }
  /* enemies */
  for (const e of b.enemies) {
    if (!e.alive) continue;
    const spr = enemySprite(e);
    const fi = e.kind === 'shrub' ? Math.floor(t * 2.5 + e.ph) % 2 : Math.floor(t * (e.kind === 'gerald' ? (e.enraged ? 12 : 6) : 9) + e.ph) % 3;
    const fr = spr.frames[fi];
    let x = e.x - fr.width / 2 + (e.shake > 0 ? rand(-2, 2) : 0) + (e.step ? 6 : 0);
    let y = e.y - fr.height + (e.kind !== 'shrub' ? Math.round(Math.sin(t * 2 + e.ph) * 3) - 4 : 0);
    if (e.broken) {
      L.save(); L.globalAlpha = 0.85; L.translate(Math.round(x + fr.width / 2), Math.round(y + fr.height)); L.rotate(0.12); L.drawImage(fr, -fr.width / 2, -fr.height); L.restore();
      /* dizzy stars */
      for (let i = 0; i < 3; i++) { const a = t * 4 + i * TAU / 3; E.fillStyle = '#ffe070'; E.fillRect(Math.round(e.x + Math.cos(a) * 12), Math.round(y - 2 + Math.sin(a) * 3), 2, 2); }
    } else L.drawImage(fr, Math.round(x), Math.round(y));
    if (spr.emis && spr.emis[fi]) E.drawImage(spr.emis[fi], Math.round(x), Math.round(y));
    if (e.flash > 0) { E.globalAlpha = e.flash / 0.15; E.drawImage(silhouette(fr), Math.round(x), Math.round(y)); E.globalAlpha = 1; }
    if (e.telegraph) { E.globalAlpha = 0.4 + 0.3 * Math.sin(t * 12); E.drawImage(silhouette(fr, [255, 120, 80]), Math.round(x), Math.round(y)); E.globalAlpha = 1; }
    if (b.menu && b.menu.stage === 'target' && !b.menu.allyT && targetList()[b.menu.tsel] === e) {
      const ay = y - 8 + Math.sin(t * 8) * 2;
      E.fillStyle = '#ffe070'; E.fillRect(e.x - 3, Math.round(ay), 7, 2); E.fillRect(e.x - 2, Math.round(ay) + 2, 5, 1); E.fillRect(e.x - 1, Math.round(ay) + 3, 3, 1); E.fillRect(e.x, Math.round(ay) + 4, 1, 1);
    }
  }
  /* party (facing left) */
  for (const p of b.active) {
    const ch = CHARS[p.id];
    const ko = p.hp <= 0;
    const fr = ch.frames.left[b.actor === p ? Math.floor(t * 6) % 2 + 1 : 0];
    const x = p.bx - ch.ox - (p.step ? 10 : 0) + (p.hurt > 0 ? rand(-2, 2) : 0), y = p.by - ch.oy;
    if (ko) { L.save(); L.globalAlpha = 0.6; L.translate(p.bx, p.by); L.rotate(-Math.PI / 2); L.drawImage(fr, -ch.ox, -ch.oy + 4); L.restore(); }
    else { L.drawImage(fr, Math.round(x), Math.round(y)); const ef = ch.emis.left[0]; if (ef) E.drawImage(ef, Math.round(x), Math.round(y)); }
    if (b.actor === p) {
      const ay = y - 6 + Math.sin(t * 6) * 1.5;
      E.fillStyle = '#7ad8ff'; E.fillRect(p.bx - 2, Math.round(ay), 5, 1); E.fillRect(p.bx - 1, Math.round(ay) + 1, 3, 1); E.fillRect(p.bx, Math.round(ay) + 2, 1, 1);
      /* boost aura */
      if (b.boost > 0) for (let i = 0; i < 4 + b.boost * 3; i++) {
        const a = t * 3 + i * 1.7, rr2 = 9 + Math.sin(t * 5 + i) * 2;
        E.fillStyle = b.boost >= 3 ? '#ff8ae0' : b.boost === 2 ? '#ffd060' : '#80e0ff';
        E.fillRect(Math.round(p.bx + Math.cos(a) * rr2), Math.round(p.by - 10 + Math.sin(a) * rr2 * 1.3 - ((t * 20 + i * 5) % 14)), 1, 1);
      }
    }
    if (b.menu && b.menu.stage === 'target' && b.menu.allyT && targetList()[b.menu.tsel] === p) {
      const ay = y - 6 + Math.sin(t * 8) * 2;
      E.fillStyle = '#7aeb8a'; E.fillRect(p.bx - 3, Math.round(ay), 7, 2); E.fillRect(p.bx - 1, Math.round(ay) + 2, 3, 2);
    }
  }
  /* fx */
  for (const f of b.fx) {
    if (f.t < 0) continue;
    const k = f.t / f.life;
    if (f.kind === 'spark') { E.fillStyle = css(f.col, 1 - k); E.fillRect(Math.round(f.x), Math.round(f.y), 1, 1); }
    else if (f.kind === 'pix') { L.fillStyle = css(f.col, 1 - k); L.fillRect(Math.round(f.x), Math.round(f.y), 2, 2); E.fillStyle = css(mixc(f.col, [255, 255, 255], 0.5), (1 - k) * 0.5); E.fillRect(Math.round(f.x), Math.round(f.y), 1, 1); }
    else if (f.kind === 'shard') {
      E.save(); E.translate(f.x, f.y); E.rotate(f.rot); E.fillStyle = `rgba(200,240,255,${1 - k})`; E.beginPath(); E.moveTo(0, -f.s); E.lineTo(f.s * 0.6, f.s); E.lineTo(-f.s * 0.6, f.s * 0.4); E.fill(); E.restore();
    } else if (f.kind === 'slash') {
      const col = f.type === 'fire' ? '#ffb050' : f.type === 'sass' ? '#e0a0ff' : f.type === 'sling' ? '#d0e8ff' : '#fff2b0';
      E.save(); E.translate(f.x, f.y); E.rotate(f.rot); E.strokeStyle = col; E.globalAlpha = 1 - k; E.lineWidth = 2;
      E.beginPath(); E.arc(0, 0, 10 + k * 8, -1.2, 1.2 - k); E.stroke(); E.restore(); E.globalAlpha = 1;
    }

function updateBattle(dt) {
  const b = battle;
  b.t += dt;
  b.intro = Math.max(0, b.intro - dt * 1.4);
  b.shake = Math.max(0, b.shake - dt * 20);
  b.flash = Math.max(0, b.flash - dt * 2);
  b.breakFx = Math.max(0, b.breakFx - dt);
  b.msgT -= dt;
  if (b.dust) b.dust = Math.max(0, b.dust - dt);
  for (const e of b.enemies) { e.flash = Math.max(0, e.flash - dt); e.shake = Math.max(0, e.shake - dt); }
  for (const p of b.active) p.hurt = Math.max(0, (p.hurt || 0) - dt);
  for (let i = b.fx.length - 1; i >= 0; i--) {
    const f = b.fx[i];
    f.t += dt;
    if (f.t < 0) continue;
    if (f.t > f.life) { b.fx.splice(i, 1); continue; }
    if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += (f.kind === 'shard' ? 300 : f.kind === 'pix' ? -40 : 120) * dt; }

/* ---------- interaction ---------- */
function findInteract() {
  const [dx, dy] = DIRV[player.dir];
  const px = player.x + dx * 12, py = player.y + dy * 10 - 2;
  let best = null, bd = 1e9;
  for (const n of npcs) {
    if (!n.visible || !TALK[n.talk]) continue;
    const r = n.lying ? 22 : 14, d = dist(px, py, n.x, n.y - 2);
    if (d < r && d < bd) { best = { n }; bd = d; }
  }
  for (const o of objects) {
    if (!o.talk || !CHECK[o.talk]) continue;
    if (o.talk === 'gate' && world.gateOpen) continue;
    const r = o.kind === 'great' ? 30 : o.kind === 'gate' ? 24 : 16, d = dist(px, py, o.x, o.y - 4);
    if (d < r && d < bd) { best = { o }; bd = d; }
  }
  return best;
}
function interact(t) {
  if (t.n) {
    const n = t.n;
    if (!n.lying && !n.cat) n.dir = { left: 'right', right: 'left', up: 'down', down: 'up' }[player.dir];
    n.talking = true;
    runScript(async () => { await TALK[n.talk](n); n.talking = false; });
  } else runScript(() => CHECK[t.o.talk]());
}

/* ---------- field update ---------- */
let areaSong = 'town';
function updateField(dt) {
  const free = !blocking() && fade.a < 0.3 && mode === 'field';
  let run = false;
  if (free) {
    if (pressed.menu) { openMenu(); pressed.menu = false; }
    run = inp.run || inp.b || inp.stickRun;
    const mx = inp.mx, my = inp.my, mag = Math.hypot(mx, my);
    if (mag > 0.05) {
      const sp = player.speed * (run ? 1.7 : 1) * Math.min(1, 0.35 + mag * 0.8);
      player.dir = dirFrom(mx, my);
      player.moving = moveActor(player, mx * sp * dt, my * sp * dt);
    } else player.moving = false;
    const t = findInteract();
    fieldHint = t ? (t.n ? 'TALK' : 'LOOK') : '';
    if (pressed.a && t) interact(t);
    checkTriggers();
  } else if (!player.scripted) player.moving = false;
  animate(player, dt, player.moving, run ? 1.6 : 1);
  /* follower trail */
  const last = trail[trail.length - 1];
  if (!last || dist(last.x, last.y, player.x, player.y) >= 1) { trail.push({ x: player.x, y: player.y, dir: player.dir }); if (trail.length > 80) trail.shift(); }
  if (follower.active) {
    const idx = trail.length - 1 - 16;
    if (idx >= 0) {
      const p = trail[idx];
      const mv = dist(follower.x, follower.y, p.x, p.y) > 0.2;
      follower.x = p.x; follower.y = p.y;
      if (mv) follower.dir = p.dir;
      animate(follower, dt, mv && player.moving, run ? 1.6 : 1);
    } else animate(follower, dt, false);
  }
  /* npcs */
  for (const n of npcs) {
    if (!n.visible) continue;
    if (n.wander && !n.talking && !scriptBusy) {
      n.wt -= dt;
      if (n.wt <= 0) { n.wt = rand(2, 5); const a = rand(0, TAU), r = rand(0, n.wander); n.tx = n.home.x + Math.cos(a) * r; n.ty = n.home.y + Math.sin(a) * r * 0.6; }
      const dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy);
      if (d > 2) {
        const sp = (n.dog ? 34 : 22) * dt;
        const mv = moveActor(n, dx / d * sp, dy / d * sp);
        n.dir = dirFrom(dx, dy);
        n.moving = mv;
        if (!mv) n.wt = 0;
      } else n.moving = false;
    } else if (!n.walkTo) n.moving = false;
    if (n.walkTo) {
      const dx = n.walkTo.x - n.x, dy = n.walkTo.y - n.y, d = Math.hypot(dx, dy);
      if (d < 1.5) { n.walkTo.res(); n.walkTo = null; n.moving = false; }
      else { const sp = 40 * dt; n.x += dx / d * Math.min(sp, d); n.y += dy / d * Math.min(sp, d); n.dir = dirFrom(dx, dy); n.moving = true; }
    }
    if (!n.lying && !n.dog && !n.cat) animate(n, dt, n.moving);
    n.bubble = (!blocking() && mode === 'field' && fieldTarget(n)) ? '…' : null;
  }
  /* scripted player walking */
  if (player.walkTo) {
    const dx = player.walkTo.x - player.x, dy = player.walkTo.y - player.y, d = Math.hypot(dx, dy);
    if (d < 1.5) { const r = player.walkTo.res; player.walkTo = null; player.scripted = false; player.moving = false; r(); }
    else { const sp = 48 * dt; player.x += dx / d * Math.min(sp, d); player.y += dy / d * Math.min(sp, d); player.dir = dirFrom(dx, dy); player.moving = true; player.scripted = true; }
  }
  /* map monsters */
  for (const en of enemiesOnMap) {
    if (!en.alive) continue;
    en.cool = Math.max(0, en.cool - dt);
    const d = dist(en.x, en.y, player.x, player.y);
    const sp = en.kind === 'moth' ? 40 : 30;
    if (free && d < 70 && en.cool <= 0) {
      en.alert = 1;
      const dx = player.x - en.x, dy = player.y - en.y;
      moveActor(en, dx / d * sp * dt, dy / d * sp * dt);
      if (d < 13) { encounter(en); break; }
    } else {
      en.alert = Math.max(0, en.alert - dt);
      en.wt -= dt;
      if (en.wt <= 0) { en.wt = rand(1.5, 3.5); en.tx = en.hx + rand(-20, 20); en.ty = en.hy + rand(-12, 12); }
      const dx = en.tx - en.x, dy = en.ty - en.y, dd = Math.hypot(dx, dy);
      if (dd > 2 && free) moveActor(en, dx / dd * 14 * dt, dy / dd * 14 * dt);
    }
  }
  /* gerald flying away */
  if (geraldOnMap.fly) { geraldOnMap.y -= 70 * dt; geraldOnMap.x += Math.sin(world.t * 3) * 30 * dt + 20 * dt; }
  /* camera */
  if (!cam.lock) {
    cam.tx = player.x + (player.moving ? DIRV[player.dir][0] * 18 : 0);
    cam.ty = player.y - 10 + (player.moving ? DIRV[player.dir][1] * 10 : 0);
  }
  const k = 1 - Math.pow(0.02, dt);
  cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k;
  cam.x = clamp(cam.x, VW / 2, MW - VW / 2); cam.y = clamp(cam.y, VH / 2, MH - VH / 2);
  world.shake = Math.max(0, world.shake - dt * 6);
  world.flash = Math.max(0, world.flash - dt * 0.8);
  /* music by area */
  if (mode === 'field' && !scriptBusy) {
    const want = world.lit ? 'town' : (forestT(player.x) > 0.5 ? 'forest' : 'town');
    if (want !== areaSong || audio.songName === '') { areaSong = want; audio.play(want); }
  }
  /* ember flying into the Great Lantern */
  if (emberFly) {
    emberFly.t += dt / emberFly.dur;
    const k2 = smooth(Math.min(1, emberFly.t));
    emberFly.x = lerp(emberFly.x0, emberFly.tx, k2);
    emberFly.y = lerp(emberFly.y0, emberFly.ty, k2) - Math.sin(k2 * Math.PI) * 30;
    if (Math.random() < 0.8) spawn({ kind: 'spark', layer: 'emis', x: emberFly.x + rand(-2, 2), y: emberFly.y + rand(-2, 2), vx: rand(-8, 8), vy: rand(-8, 8), max: rand(0.4, 0.8), col: pick([[255, 230, 140], [255, 170, 80]]) });
    if (emberFly.t >= 1) { const r = emberFly.res; emberFly = null; r(); }
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].t += dt; if (rings[i].t > rings[i].life) rings.splice(i, 1); }
}
function fieldTarget(n) { const t = findInteract(); return t && t.n === n; }

function walkPlayer(x, y) { return new Promise(res => { player.walkTo = { x, y, res }; }); }
function walkNPC(n, x, y) { return new Promise(res => { n.walkTo = { x, y, res }; }); }

/* ---------- battles from the field ---------- */
async function encounter(en) {
  scriptBusy = true;
  sfx('encounter');
  world.shake = 3;
  await wait(0.35);
  await fadeTo(1, 0.25, '#ffffff');
  const p = startBattle(en.battle, { tutorial: en.tutorial && !flags.tutorialDone, drop: en.drop });
  fade.a = 0; fade.target = 0;
  const r = await p;
  if (en.tutorial) flags.tutorialDone = true;
  await fadeTo(1, 0.35);
  battle = null;
  mode = 'field';
  audio.play(areaSong = 'forest');
  if (r === 'win') en.alive = false;
  else if (r === 'flee') { en.cool = 3; en.x = en.hx; en.y = en.hy; player.x -= 16; }
  else {
    for (const m of party) { m.hp = m.maxHp; m.sp = m.maxSp; }
    Object.assign(player, { x: 752, y: 304, dir: 'right' });
    trail.length = 0; follower.x = 740; follower.y = 304;
    en.x = en.hx; en.y = en.hy; en.cool = 2;
  }
  cam.x = player.x; cam.y = player.y;
  await fadeTo(0, 0.5);
  if (r === 'lose') {
    await narrate('Pip woke up at the forest edge. Moss is pretending not to have been worried.');
    await say('Moss', 'I wasn\'t worried. My eyes are just sweaty.');
  }
  /* small top-up between fights */
  if (r === 'win') for (const m of party) if (m.joined) m.hp = Math.max(m.hp, Math.round(m.maxHp * 0.5));
  scriptBusy = false;
}

    for (let i = 0; i < 40; i++) { const a = rand(0, TAU), s = rand(40, 80); spawn({ kind: 'spark', layer: 'emis', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: 40, drag: 0.97, max: rand(0.9, 1.5), col, size: 1 }); }
  }, k * 450 + rand(0, 200));
}

/* ---------- title & ending ---------- */
function toTitle() {
  mode = 'title'; titleT = 0;
  battle = null; dlg = null; choiceBox = null; menuOpen = null; scriptBusy = false;
  resetState();
  geraldOnMap.visible = true;
  audio.play('title');
  fade.a = 1; fade.target = 0; fade.speed = 1;
}
function updateTitle(dt) {
  titleT += dt;
  cam.lock = true;
  if (coverMode) { cam.x = 392; cam.y = 226; return; }
  cam.x = 330 + Math.sin(titleT * 0.06) * 200; cam.y = 300 + Math.sin(titleT * 0.045) * 60;
  cam.x = clamp(cam.x, VW / 2, MW - VW / 2); cam.y = clamp(cam.y, VH / 2, MH - VH / 2);
  if ((pressed.a || pressed.tap) && titleT > 0.6 && fade.a < 0.5) {
    sfx('ok');
    pressed.a = pressed.tap = false;
    runScript(async () => {
      await fadeTo(1, 0.8);
      resetState();
      mode = 'field';
      await introScene();
    });
  }
}
function drawTitle() {
  const u = S, cx = W / 2, cy = H * 0.36;
  const g = D.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(6,4,18,0.55)'); g.addColorStop(0.5, 'rgba(6,4,18,0.1)'); g.addColorStop(1, 'rgba(6,4,18,0.6)');
  D.fillStyle = g; D.fillRect(0, 0, W, H);
  const a = Math.min(1, titleT / 1.5);
  D.globalAlpha = a;
  /* glow behind the logo */
  const gl = D.createRadialGradient(cx, cy, 0, cx, cy, 120 * u);
  gl.addColorStop(0, 'rgba(255,190,100,0.35)'); gl.addColorStop(1, 'rgba(255,190,100,0)');
  D.fillStyle = gl; D.fillRect(cx - 140 * u, cy - 120 * u, 280 * u, 240 * u);
  text('THE', cx, cy - 30 * u, 9 * u, '#ffe6b0', 'center', 700);
  D.save();
  D.font = font(30 * u, 700); D.textAlign = 'center'; D.textBaseline = 'middle';
  D.lineWidth = 2.4 * u; D.strokeStyle = '#2a1030'; D.strokeText('Lantern Keeper', cx, cy);
  const lg = D.createLinearGradient(0, cy - 16 * u, 0, cy + 16 * u);
  lg.addColorStop(0, '#fffbe8'); lg.addColorStop(0.45, '#ffd56a'); lg.addColorStop(1, '#ff8a3a');
  D.shadowColor = 'rgba(255,170,80,0.9)'; D.shadowBlur = 14 * u;
  D.fillStyle = lg; D.fillText('Lantern Keeper', cx, cy);
  D.restore();
  text('a very small adventure  ·  demo', cx, cy + 22 * u, 7.5 * u, '#d8c8ff', 'center', 600);
  if (!coverMode && titleT > 1 && Math.floor(titleT * 1.6) % 2 === 0) text(touchUI ? 'Tap to begin' : 'Press Z or click to begin', cx, H * 0.72, 9 * u, UIC.text, 'center', 700);
  if (!coverMode) text('Pixels, music & sound generated in code · Made with Claude Code', cx, H - 12 * u - safe.b * DPR, 5.5 * u, 'rgba(216,200,255,0.65)', 'center', 500);
  D.globalAlpha = 1;
}
function updateEnding(dt) {
  endingT += dt;
  cam.lock = true;
  cam.tx = 392 + Math.sin(endingT * 0.1) * 120; cam.ty = 236;
  const k = 1 - Math.pow(0.1, dt);
  cam.x += (cam.tx - cam.x) * k; cam.y += (cam.ty - cam.y) * k;
  if (Math.random() < dt * 0.8) fireworks(1);
  if ((pressed.a || pressed.tap) && endingT > 3) { pressed.a = pressed.tap = false; runScript(async () => { await fadeTo(1, 1); toTitle(); }); }
}
function drawEnding() {
  const u = S, cx = W / 2;
  const a = Math.min(1, endingT / 2);
  D.globalAlpha = a;
  const vg = D.createLinearGradient(0, H * 0.4, 0, H); vg.addColorStop(0, 'rgba(6,4,18,0)'); vg.addColorStop(1, 'rgba(6,4,18,0.7)');
  D.fillStyle = vg; D.fillRect(0, 0, W, H);
  const pw = Math.min(300 * u, W - 20 * u), ph = 100 * u, px = (W - pw) / 2, py = H - ph - 12 * u - safe.b * DPR;
  panel(px, py, pw, ph);
  text('THE LANTERN KEEPER', cx, py + 10 * u, 11 * u, UIC.gold, 'center', 700);
  text('Demo complete. Thanks for playing!', cx, py + 28 * u, 8 * u, UIC.text, 'center', 600);
  text(`Battles won: ${stats.wins}   ·   Breaks: ${stats.breaks}   ·   Pip Lv ${party[0].lv}`, cx, py + 46 * u, 6.5 * u, UIC.dim, 'center', 600);
  text(flags.geraldFriend ? 'Gerald visits on Tuesdays. He brings lint.' : 'Gerald is still on the roof. Nobody knows how to ask him to leave.', cx, py + 60 * u, 6.5 * u, UIC.dim, 'center', 500);
  text('Chapter 1: coming eventually.', cx, py + 74 * u, 7.5 * u, '#ffb8e0', 'center', 600);
  if (endingT > 3 && Math.floor(endingT * 1.6) % 2 === 0) text(touchUI ? 'Tap to return to the title' : 'Press Z to return to the title', cx, py + ph - 18 * u, 7 * u, UIC.text, 'center', 700);
  D.globalAlpha = 1;
}
function drawOverlayFx() {
  const cx = Math.round(cam.x - VW / 2), cy = Math.round(cam.y - VH / 2);
  D.globalCompositeOperation = 'lighter';
  for (const r of rings) {
    if (r.t < 0) continue;
    const k = r.t / r.life, rad = easeOut(k) * 260 * S;
    D.strokeStyle = `rgba(255,190,110,${(1 - k) * 0.45})`;
    D.lineWidth = (1 - k) * 6 * S;
    D.beginPath(); D.ellipse((r.x - cx) * S, (r.y - cy) * S, rad, rad * 0.6, 0, 0, TAU); D.stroke();
  }
  if (emberFly) {
    const x = (emberFly.x - cx) * S, y = (emberFly.y - cy) * S;
    const g = D.createRadialGradient(x, y, 0, x, y, 18 * S);
    g.addColorStop(0, 'rgba(255,250,220,1)'); g.addColorStop(0.2, 'rgba(255,200,110,0.8)'); g.addColorStop(1, 'rgba(255,140,60,0)');
    D.fillStyle = g; D.fillRect(x - 18 * S, y - 18 * S, 36 * S, 36 * S);
  }
  D.globalCompositeOperation = 'source-over';
}

/* ---------- quality auto-tune ---------- */
const autoQ = { acc: 0, n: 0, locked: false, grace: 3 };
function autoQuality(dt) {
  if (autoQ.locked || mode === 'loading') return;
  if (autoQ.grace > 0) { autoQ.grace -= dt; return; }
  autoQ.acc += dt; autoQ.n++;
  if (autoQ.n >= 120) {
    const avg = autoQ.acc / autoQ.n;
    if (avg > 1 / 42 && quality > 0) { quality--; autoQ.grace = 2; }
    autoQ.acc = 0; autoQ.n = 0;
  }
}

/* ---------- main loop ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = clamp((now - lastT) / 1000, 0, 0.05);
  lastT = now;
  try {
    autoQuality(dt);
    pollInput(dt);
    world.t += dt;
    update(dt);
    render();
  } catch (e) { console.error(e); }
  clearPressed();
  requestAnimationFrame(frame);
}
function update(dt) {
  updateTimers(dt);
  updateDialog(dt);
  updateMenu();
  updateParticles(dt);
  if (mode === 'title') updateTitle(dt);
  else if (mode === 'field') updateField(dt);
  else if (mode === 'battle' && battle) updateBattle(dt);
  else if (mode === 'ending') updateEnding(dt);
}
function render() {
  hits = [];
  if (touchUI && H > W * 1.05) { drawRotate(); return; }
  if (mode === 'sprites') { drawSheet(); return; }
  if (mode === 'battle' && battle) renderBattle();
  else { renderField(); drawOverlayFx(); }
  if (mode === 'title') drawTitle();
  if (mode === 'ending') drawEnding();
  drawCine();
  if (mode === 'field') drawControls();
  drawFade();
  drawDialog();
  drawMenu();
}

/* ---------- boot ---------- */
function drawLoading(msg) {
  D.fillStyle = '#05040c'; D.fillRect(0, 0, W, H);
  text(msg, W / 2, H / 2, 10 * S, '#ffd56a', 'center', 700);
}
function boot() {
  resize();
  window.addEventListener('resize', () => { resize(); layoutBattle(); });
  drawLoading('Lighting the lanterns...');
  setTimeout(() => {
    buildGround();
    buildWorld();
    buildChars();
    buildNPCs();
    initialNPC = npcs.map(n => ({ x: n.x, y: n.y, dir: n.dir, visible: n.visible, wander: n.wander, home: { x: n.x, y: n.y }, talking: false, walkTo: null }));
    initFlies();
    initBattleBG();
    SPR.fShrub = makeFieldShrub(); SPR.fMoth = makeFieldMoth();
    resetState();
    const scene = qs.get('scene');
    if (scene) debugScene(scene);
    else toTitle();
    lastT = performance.now();
    requestAnimationFrame(frame);
  }, 30);
}

function debugScene(s) {
  mode = 'field';
  fade.a = 0; fade.target = 0;
  flags.intro = true;
  if (s === 'town') { Object.assign(player, { x: 392, y: 340, dir: 'up' }); }
  if (s === 'forest' || s === 'boss' || s === 'battle' || s === 'bossfight') {
    flags.mayor = flags.moss = true; party[1].joined = true; follower.active = true; world.gateOpen = true; markSolid(...world.gate.solid, 0);
    npc('moss').visible = false; inventory.cookie = 3;
    Object.assign(player, { x: s === 'boss' ? 980 : 770, y: 304, dir: 'right' });
    Object.assign(follower, { x: player.x - 14, y: 304 });
  }
  if (s === 'battle') runScript(() => encounter(enemiesOnMap[0]));
  if (s === 'bossfight') { flags.gerald = true; Object.assign(player, { x: 1010, y: 304 }); runScript(bossFight); }
  if (s === 'relight') { flags.mayor = flags.moss = flags.gerald = true; party[1].joined = true; geraldOnMap.visible = false; runScript(relightScene); }
  if (s === 'sprites') { mode = 'sprites'; return; }
  if (s === 'cover') {
    toTitle(); coverMode = true; fade.a = 0; titleT = 5;
    world.lit = true; for (const l of world.lamps) l.lit = 1;
    const spots = { mayor: [340, 316, 'down'], baker: [446, 318, 'down'], tobin: [318, 330, 'right'], zuzu: [468, 300, 'down'], biscuit: [430, 336, 'left'] };
    for (const [id, [x, y, d]] of Object.entries(spots)) Object.assign(npc(id), { x, y, dir: d, wander: 0 });
    Object.assign(geraldOnMap, { x: 548, y: 140, visible: true });
    Object.assign(player, { x: 380, y: 322, dir: 'down' }); follower.active = true; Object.assign(follower, { x: 404, y: 324, dir: 'down' });
    return;
  }
  if (s === 'ending') { world.lit = true; for (const l of world.lamps) l.lit = 1; mode = 'ending'; endingT = 0; }
  cam.x = cam.tx = player.x; cam.y = cam.ty = player.y;
  audio.play(forestT(player.x) > 0.5 ? 'forest' : 'town');
}

function drawSheet() {
  D.fillStyle = '#6a7a6a'; D.fillRect(0, 0, W, H);
  D.imageSmoothingEnabled = false;
  const ids = (qs.get('ids') || Object.keys(CHARS).join(',')).split(',');
  const sc = +(qs.get('sc') || 3);
  ids.forEach((id, i) => {
    let x = 4, y = 4 + i * 31 * sc;
    for (const d of ['down', 'up', 'left', 'right']) for (let f = 0; f < 3; f++) { D.drawImage(CHARS[id].frames[d][f], x, y, 20 * sc, 30 * sc); x += 21 * sc; }
  });
  if (qs.get('ids')) return;
  const extra = [SPR.grandpaLying, SPR.dog[0], SPR.cat[0], SPR.fShrub[0], SPR.fMoth[0], SPR.lamp.c, SPR.gl.c, SPR.glLit.c, SPR.well.c, SPR.tent.c, SPR.gate.c, SPR.oldLamp.c];
  let x = 860;
  for (const c of extra) { D.drawImage(c, x, 10, c.width * sc, c.height * sc); x += c.width * sc + 6; if (x > W - 100) break; }
}
/* test hooks */
window.LK = { get mode() { return mode; }, get dlg() { return dlg && dlg.text; }, get busy() { return scriptBusy; }, get choice() { return !!choiceBox; }, get menu() { return battle && battle.menu && battle.menu.stage; }, get fade() { return fade.a; }, enemiesOnMap, inventory, stats, player, battle: () => battle, flags, party, world, npcs, cam, setQuality: q => { quality = q; autoQ.locked = true; } };

boot();

})();
</script>

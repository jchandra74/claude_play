function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const GEN_NAMES = ['Night Runner', 'Laser Lagoon', 'Vapor Vault', 'Hyperdrive', 'Magenta Maze', 'Chrome Canyon',
  'Electric Dreams', 'Midnight Mall', 'Cyber Coast', 'Pixel Palms', 'Turbo Tunnel', 'Starlight Strip'];
function getLevelDef(n) {
  if (n <= LEVELS.length) return LEVELS[n - 1];
  const rnd = mulberry32(n * 7919 + 13);
  if (n % 5 === 0) {
    const rows = [];
    for (let i = 0; i < 8; i++) rows.push('............');
    const pal = 'mpbcgyor';
    for (let r = 0; r < 4; r++) {
      let half = '';
      for (let c = 0; c < 6; c++) {
        const v = rnd();
        half += v < 0.2 ? '.' : v < 0.4 ? 'S' : v < 0.5 ? 'X' : pal[Math.floor(rnd() * pal.length)];
      }
      rows.push(half + half.split('').reverse().join(''));
    }
    return { name: BOSS_NAMES[(n / 5 - 1) % BOSS_NAMES.length] + ' MK' + (Math.floor((n / 5 - 1) / BOSS_NAMES.length) + 2), boss: true, rows };
  }
  const pal = ['mpbc', 'roygc', 'cbpm', 'gyor', 'mrmr', 'cgcg', 'pbcm'][Math.floor(rnd() * 7)];
  const nRows = 7 + Math.min(5, Math.floor(n / 4));
  const rows = [];
  const density = 0.72 + rnd() * 0.2;
  for (let r = 0; r < nRows; r++) {
    let half = '';
    const rowEmpty = rnd() < 0.12;
    for (let c = 0; c < 6; c++) {
      if (rowEmpty || rnd() > density) { half += '.'; continue; }
      const v = rnd();
      half += v < 0.05 + n * 0.004 ? 'S' : v < 0.1 + n * 0.004 ? 'X' : (v < 0.13 && r > 1 && r < nRows - 1) ? 'G' : pal[r % pal.length];
    }
    rows.push(half + half.split('').reverse().join(''));
  }
  rows.unshift('............');
  return { name: GEN_NAMES[n % GEN_NAMES.length], rows };
}

function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);

const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function makeNoise(c) {
  const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function makeIR(c, secs, decay) {
  const len = Math.floor(c.sampleRate * secs), b = c.createBuffer(2, len, c.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return b;
}
function buildGraph(c) {
  A.ctx = c;
  A.master = c.createGain(); A.master.gain.value = 0.85;
  A.comp = c.createDynamicsCompressor();
  A.comp.threshold.value = -14; A.comp.knee.value = 12; A.comp.ratio.value = 4; A.comp.attack.value = 0.004; A.comp.release.value = 0.2;
  A.master.connect(A.comp); A.comp.connect(c.destination);
  A.music = c.createGain(); A.music.gain.value = settings.music ? 0.5 : 0;
  A.mFilter = c.createBiquadFilter(); A.mFilter.type = 'lowpass'; A.mFilter.frequency.value = 18000; A.mFilter.Q.value = 0.9;
  A.music.connect(A.mFilter); A.mFilter.connect(A.master);
  A.sfx = c.createGain(); A.sfx.gain.value = settings.sfx ? 0.75 : 0; A.sfx.connect(A.master);
  A.duck = c.createGain(); A.duck.connect(A.music);
  A.mRev = c.createConvolver(); A.mRev.buffer = makeIR(c, 2.6, 2.4);
  A.mRevIn = c.createGain(); A.mRevIn.connect(A.mRev); A.mRev.connect(A.music);
  A.sRev = c.createConvolver(); A.sRev.buffer = makeIR(c, 1.4, 3);
  A.sRevIn = c.createGain(); A.sRevIn.connect(A.sRev); A.sRev.connect(A.sfx);
  A.dly = c.createDelay(1.5); A.dly.delayTime.value = 60 / A.bpm * 0.75;
  A.dfb = c.createGain(); A.dfb.gain.value = 0.38;
  A.dlp = c.createBiquadFilter(); A.dlp.type = 'lowpass'; A.dlp.frequency.value = 2600;
  A.dlyIn = c.createGain();
  A.dlyIn.connect(A.dly); A.dly.connect(A.dlp); A.dlp.connect(A.dfb); A.dfb.connect(A.dly); A.dlp.connect(A.music);
  A.noiseBuf = makeNoise(c);
}
function audioInit() {
  if (A.ctx) { if (A.ctx.state === 'suspended' && !document.hidden) A.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { buildGraph(new AC({ latencyHint: 'interactive' })); } catch (e) { A.ctx = null; return; }
  // iOS unlock: play a silent buffer inside the gesture
  try { const s = A.ctx.createBufferSource(); s.buffer = A.ctx.createBuffer(1, 1, 22050); s.connect(A.ctx.destination); s.start(0); } catch (e) {}
  if (A.ctx.state === 'suspended') A.ctx.resume();
  A.nextTime = A.ctx.currentTime + 0.1; A.step = 0; A.bar = 0; A.started = true;
}
setInterval(() => { if (A.ctx && A.started && A.ctx.state === 'running') schedule(A.ctx.currentTime + 0.15); }, 25);
function schedule(until) {
  if (A.nextTime < A.ctx.currentTime - 0.05) A.nextTime = A.ctx.currentTime + 0.05;
  while (A.nextTime < until) { playStep(A.step, A.nextTime); A.nextTime += stepDur(); A.step++; }
}

function voice(type, f, t, dur, vol, dest, o = {}) {
  const c = A.ctx, osc = c.createOscillator(), g = c.createGain();
  osc.type = type; osc.frequency.setValueAtTime(f, t);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.toT || dur));
  if (o.det) osc.detune.setValueAtTime(o.det, t);
  const at = o.a || 0.004;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + at);
  if (o.hold) g.gain.setValueAtTime(vol, t + at + o.hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let n = osc;
  if (o.ft) {
    const fl = c.createBiquadFilter(); fl.type = o.ft; fl.frequency.setValueAtTime(o.ff, t);
    if (o.ffTo) fl.frequency.exponentialRampToValueAtTime(o.ffTo, t + (o.ffT || dur));
    fl.Q.value = o.q || 0.7; n.connect(fl); n = fl;
  }
  n.connect(g);
  let out = g;
  if (o.pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); out = p; }
  out.connect(dest);
  if (o.send) { const s = c.createGain(); s.gain.value = o.sendAmt || 0.3; out.connect(s); s.connect(o.send); }
  osc.start(t); osc.stop(t + dur + 0.05);
  return osc;
}
function noiseHit(t, dur, vol, dest, o = {}) {
  const c = A.ctx, src = c.createBufferSource(), g = c.createGain();
  src.buffer = A.noiseBuf; src.loop = true;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + (o.a || 0.002));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  let n = src;
  if (o.ft) {
    const fl = c.createBiquadFilter(); fl.type = o.ft; fl.frequency.setValueAtTime(o.ff, t);
    if (o.ffTo) fl.frequency.exponentialRampToValueAtTime(o.ffTo, t + dur);
    fl.Q.value = o.q || 0.7; n.connect(fl); n = fl;
  }
  n.connect(g);
  let out = g;
  if (o.pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(o.pan, -1, 1); g.connect(p); out = p; }
  out.connect(dest);
  if (o.send) { const s = c.createGain(); s.gain.value = o.sendAmt || 0.3; out.connect(s); s.connect(o.send); }
  src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
}

}

}

}

  notes.forEach(m => {

    voice('sawtooth', f, t, dur, 0.03, A.duck, { det: 10, a: 0.35, hold: dur - 1.0, ft: 'lowpass', ff: 1200, q: 1, send: A.mRevIn, sendAmt: 0.6, pan: 0.4 });
  });
}
function arp(t, m, v, pan) {
  voice('sawtooth', mtof(m), t, 0.16, 0.045 * v, A.music, { ft: 'lowpass', ff: 3800, ffTo: 900, q: 3, pan, send: A.dlyIn, sendAmt: 0.6 });

}
function lead(t, m, dur) {
  const c = A.ctx, f = mtof(m), g = c.createGain(), flt = c.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.setValueAtTime(900, t); flt.frequency.exponentialRampToValueAtTime(3400, t + 0.08);
  flt.frequency.exponentialRampToValueAtTime(1800, t + dur + 0.2); flt.Q.value = 2;
  const lfo = c.createOscillator(), lg = c.createGain();
  lfo.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(14, t + Math.min(dur, 0.4)); lfo.connect(lg);
  [-7, 7].forEach(d => {
    const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f, t); o.detune.setValueAtTime(d, t);
    lg.connect(o.detune); o.connect(flt); o.start(t); o.stop(t + dur + 0.35);
  });
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.07, t + 0.02);
  g.gain.setValueAtTime(0.07, t + Math.max(0.03, dur - 0.05)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);
  flt.connect(g); g.connect(A.music);
  const s1 = c.createGain(); s1.gain.value = 0.45; g.connect(s1); s1.connect(A.dlyIn);
  const s2 = c.createGain(); s2.gain.value = 0.35; g.connect(s2); s2.connect(A.mRevIn);
  lfo.start(t); lfo.stop(t + dur + 0.35);
}

function playStep(step, t) {

  if (s === 0) {
    if (A.nextSong) { A.song = A.nextSong; A.nextSong = null; A.bar = 0; }
    else if (step > 0) A.bar = (A.bar + 1) % 8;

function resize() {

function buildBackground() {
  bgCanvas = document.createElement('canvas'); bgCanvas.width = cvs.width; bgCanvas.height = cvs.height;
  const g = bgCanvas.getContext('2d'); g.scale(DPR, DPR);
  horizonY = OY + (H - 360) * S;

  const sky = g.createLinearGradient(0, 0, 0, horizonY);

  g.fillStyle = sky; g.fillRect(0, 0, VW, horizonY + 1);

  const gr = g.createLinearGradient(0, horizonY, 0, VH);
  gr.addColorStop(0, '#2b0742'); gr.addColorStop(0.3, '#12022a'); gr.addColorStop(1, '#050010');
  g.fillStyle = gr; g.fillRect(0, horizonY, VW, VH - horizonY);

  const halo = g.createRadialGradient(cx, sunY, sunR * 0.6, cx, sunY, sunR * 2.6);
  halo.addColorStop(0, 'rgba(255,70,170,0.45)'); halo.addColorStop(0.5, 'rgba(160,20,140,0.15)'); halo.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = halo; g.fillRect(0, 0, VW, horizonY);
  const sc = document.createElement('canvas'); sc.width = Math.ceil(sunR * 2 * DPR) + 2; sc.height = sc.width;
  const sg = sc.getContext('2d'); sg.scale(DPR, DPR);
  const grad = sg.createLinearGradient(0, 0, 0, sunR * 2);
  grad.addColorStop(0, '#fff6a0'); grad.addColorStop(0.3, '#ffc23d'); grad.addColorStop(0.62, '#ff4f8b'); grad.addColorStop(1, '#b0128f');

  g.save(); g.beginPath(); g.rect(0, 0, VW, horizonY); g.clip();
  g.drawImage(sc, cx - sunR, sunY - sunR, sc.width / DPR, sc.height / DPR);
  g.restore();
  // mountains (2 layers)
  const rnd = mulberry32(42);
  const layer = (heightMul, fill, edge, seedShift) => {
    g.beginPath(); g.moveTo(0, horizonY);
    const step = 26 * S; let x = 0;
    const pts = [];
    while (x <= VW + step) {
      const dist = Math.abs(x - cx) / (VW / 2 + 1);
      const base = (24 + 150 * Math.pow(Math.min(1, dist * 1.1), 1.6)) * heightMul * S;
      const h = base * (0.55 + rnd() * 0.6) + seedShift * S;

  g.fillStyle = hg; g.fillRect(0, horizonY - 10 * S, VW, 24 * S);

  const srnd = mulberry32(7);
  const n = Math.floor(VW * horizonY / 4200);
  for (let i = 0; i < n; i++) {
    const y = srnd() * horizonY * 0.85;
    stars.push({ x: srnd() * VW, y, s: srnd() < 0.1 ? 2 : 1, ph: srnd() * 6.28, sp: 0.5 + srnd() * 2.5, a: 0.3 + srnd() * 0.7 * (1 - y / horizonY) });

  const rg = vg.createRadialGradient(cvs.width / 2, cvs.height / 2, Math.min(cvs.width, cvs.height) * 0.35, cvs.width / 2, cvs.height / 2, Math.max(cvs.width, cvs.height) * 0.75);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.6)');

  scanPat = ctx.createPattern(sp, 'repeat');
}

/* ============================================================

   ============================================================ */

}

function drawBalls() {
  ctx.globalCompositeOperation = 'lighter';
  const fire = G.power.fire > 0;
  const col = fire ? '#ff7a1f' : '#38f2ff';
  const spr = dotSprite(col);
  for (const b of G.balls) {
    const tr = b.trail, n = tr.length / 2;
    for (let i = 0; i < n; i++) {
      const k = (i + 1) / n, s = BALL_R * (0.5 + k * 1.6);
      ctx.globalAlpha = k * 0.45;
      ctx.drawImage(spr, tr[i * 2] - s, tr[i * 2 + 1] - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1;
    ctx.drawImage(spr, b.x - 26, b.y - 26, 52, 52);
  }
  ctx.globalCompositeOperation = 'source-over';
  for (const b of G.balls) {
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R * 0.78, 0, Math.PI * 2); ctx.fill();

}
function drawCaps() {
  const ss = SPR.ss;
  for (const c of G.caps) {
    const spr = SPR['cap' + c.k], dw = spr.width / ss, dh = spr.height / ss;
    const sy = 0.85 + 0.15 * Math.abs(Math.sin(c.t * 5));
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(1, sy);

    ctx.restore();

}
function drawLasers() {
  ctx.globalCompositeOperation = 'lighter';

    ctx.strokeStyle = 'rgba(255,60,60,0.45)'; ctx.lineWidth = 7; ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + 22); ctx.stroke();
    ctx.strokeStyle = '#ffe0e0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y + 22); ctx.stroke();
  }
  for (const s of G.shots) {
    const r = 11 + Math.sin(s.t * 20) * 2;
    ctx.drawImage(dotSprite('#ff3b6b'), s.x - r * 2.2, s.y - r * 2.2, r * 4.4, r * 4.4);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, 4.5, 0, 7); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawParticles() {
  ctx.globalCompositeOperation = 'lighter';
  for (const p of G.parts) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = a;
    if (p.type === 'dot') { const s = p.size * (0.5 + a * 0.5); ctx.drawImage(dotSprite(p.color), p.x - s, p.y - s, s * 2, s * 2); }
    else if (p.type === 'spark') {
      ctx.strokeStyle = p.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035); ctx.stroke();
    } else if (p.type === 'shard') {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    } else if (p.type === 'ring') {

      ctx.beginPath(); ctx.arc(p.x, p.y, lerp(p.r0, p.r1, k), 0, Math.PI * 2); ctx.stroke();

}
function drawTexts() {

}

function gtext(txt, x, y, size, color, o = {}) {

}

function drawBanner() {

    ctx.save(); ctx.shadowColor = d.color || '#00e8ff'; ctx.shadowBlur = 10 * S * DPR;
    ctx.strokeStyle = d.color || '#00e8ff'; ctx.lineWidth = 2; rr(ctx, x, y, bw, bh, 12); ctx.stroke(); ctx.restore();

function drawPause() {

  const defs = [

    { label: 'SOUND FX: ' + (settings.sfx ? 'ON' : 'OFF'), fn: () => { settings.sfx = !settings.sfx; saveSettings(); applyVolumes(); } },

function drawClear() {

function draw() {
  const pulse = beatPulse();
  drawBackground(pulse);
  const sh = G.shake * G.shake * 16;
  const sx = sh ? rand(-sh, sh) : 0, sy = sh ? rand(-sh, sh) : 0;
  setWorld(sx, sy);
  drawWalls();
  drawBricks();
  drawBoss();
  drawCaps();
  drawLasers();
  drawBalls();
  if (G.state !== 'gameover' || G.stateTime < 0.1) drawPaddle();
  drawParticles();

  setWorld(sx * 0.3, sy * 0.3);
  if (G.state !== 'title') { drawHUD(); drawBossBar(); }
  drawHint();

  }
  ctx.drawImage(vignette, 0, 0);
  ctx.globalAlpha = 0.22; ctx.fillStyle = scanPat; ctx.fillRect(0, 0, cvs.width, cvs.height); ctx.globalAlpha = 1;
}

/* ============================================================
   INPUT
   ============================================================ */
const input = { left: false, right: false, kv: 0, isTouch: matchMedia('(pointer: coarse)').matches, ptrs: new Map() };
function toLogical(cx, cy) { return { x: (cx - OX) / S, y: (cy - OY) / S }; }
function action() {
  if (G.state === 'title') { startGame(); return; }
  if (G.state === 'gameover') { if (G.stateTime > 1.2) startGame(); return; }
  if (G.state === 'play' && !G.paused) launch();
}
function togglePause(on) {
  if (G.state === 'title' || G.state === 'gameover') return;
  G.paused = on === undefined ? !G.paused : on;
  SFX.ui();
  cvs.classList.toggle('playing', !G.paused);
}
function toggleFullscreen() {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  } catch (e) {}
}
function handleUIDown(p) {
  if (G.paused) {
    for (const b of G.uiButtons) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); SFX.ui(); return true; }
    return true;
  }
  if (G.state !== 'title' && G.state !== 'gameover' && Math.hypot(p.x - (W - 34), p.y - 32) < 30) { togglePause(true); return true; }
  if (G.state === 'title' || G.state === 'gameover') { action(); return true; }
  return false;
}
cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  if (e.pointerType !== 'mouse') input.isTouch = true; else if (!input.ptrs.size) input.isTouch = false;
  const p = toLogical(e.clientX, e.clientY);
  const rec = { lx: e.clientX, t: performance.now(), moved: 0, type: e.pointerType, ui: false };
  input.ptrs.set(e.pointerId, rec);
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  if (handleUIDown(p)) { rec.ui = true; return; }
  if (e.pointerType === 'mouse') { G.paddle.tx = p.x; if (e.button === 0) action(); }
}, { passive: false });
cvs.addEventListener('pointermove', e => {
  e.preventDefault();
  const rec = input.ptrs.get(e.pointerId);
  if (e.pointerType === 'mouse') {
    if (!G.paused) G.paddle.tx = toLogical(e.clientX, e.clientY).x;
    return;
  }
  if (!rec || rec.ui || G.paused) return;
  const dx = (e.clientX - rec.lx) / S * TOUCH_SENS;
  rec.lx = e.clientX; rec.moved += Math.abs(dx);
  G.paddle.tx = clamp(G.paddle.tx + dx, G.paddle.w / 2, W - G.paddle.w / 2);
}, { passive: false });
function ptrEnd(e) {
  const rec = input.ptrs.get(e.pointerId);
  input.ptrs.delete(e.pointerId);
  if (!rec || rec.ui || e.type === 'pointercancel') return;
  if (rec.type !== 'mouse' && rec.moved < 14 && performance.now() - rec.t < 350) action();
}
cvs.addEventListener('pointerup', ptrEnd);
cvs.addEventListener('pointercancel', ptrEnd);
cvs.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchend', () => audioInit(), { passive: true });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  audioInit();
  switch (e.code) {
    case 'ArrowLeft': case 'KeyA': input.left = true; input.isTouch = false; break;
    case 'ArrowRight': case 'KeyD': input.right = true; input.isTouch = false; break;
    case 'Space': case 'ArrowUp': case 'Enter': case 'KeyW':
      if (G.paused) { if (e.code !== 'ArrowUp' && e.code !== 'KeyW') togglePause(false); } else action();
      break;
    case 'KeyP': case 'Escape': togglePause(); break;
    case 'KeyM': settings.music = !settings.music; saveSettings(); applyVolumes(); break;
    case 'KeyF': toggleFullscreen(); break;
    default: return;
  }
  e.preventDefault();
});
window.addEventListener('keyup', e => {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') input.left = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') input.right = false;
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (G.state !== 'title' && G.state !== 'gameover' && !G.paused) togglePause(true);
    if (A.ctx && A.ctx.state === 'running') A.ctx.suspend();
  } else if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
});
window.addEventListener('blur', () => { input.left = input.right = false; });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000));
  last = ts;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
resize();
newGame(true);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(`900 40px Orbitron`), document.fonts.load(`400 40px "Mr Dafoe"`)]).then(() => buildSprites()).catch(() => {});
}
requestAnimationFrame(frame);

// debug / test hooks
window.__NB = { G, A, newGame, startGame, SFX, settings, buildGraph, playStep, stepDur };
})();
</script>

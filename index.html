<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07020f">
<title>Claude Play Arcade</title>
<meta name="description" content="A collection of single-file browser games. Play instantly on desktop or mobile.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07020f;
    --panel: #120826;
    --panel-2: #1a0d33;
    --line: rgba(160, 120, 255, 0.18);
    --text: #f2ecff;
    --muted: #a99cc8;
    --pink: #ff2bd6;
    --cyan: #00e8ff;
    --gold: #ffe84a;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(255, 43, 214, 0.18), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(0, 232, 255, 0.10), transparent 60%),
      var(--bg);
  }
  /* perspective grid floor */
  body::before {
    content: ""; position: fixed; left: -50%; right: -50%; bottom: 0; height: 45vh; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(255, 43, 214, 0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 43, 214, 0.35) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(400px) rotateX(62deg); transform-origin: bottom;
    mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent 85%);
    animation: scroll 3s linear infinite;
  }
  @keyframes scroll { to { background-position: 0 60px, 0 0; } }
  @media (prefers-reduced-motion: reduce) { body::before { animation: none; } .card { transition: none; } }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 56px 16px 80px; }
  header { text-align: center; margin-bottom: 44px; }
  .eyebrow { font: 600 12px/1 Orbitron, sans-serif; letter-spacing: 0.35em; color: var(--cyan); text-transform: uppercase; }
  h1 {
    margin: 14px 0 12px; font: 900 clamp(38px, 7vw, 72px)/1.02 Orbitron, sans-serif; letter-spacing: 0.02em;
    background: linear-gradient(180deg, #ffffff 0%, #9fe6ff 45%, #2a6dd8 50%, #ff5fd2 62%, #ffe2fa 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(0, 232, 255, 0.35));
  }
  .lede { margin: 0 auto; max-width: 560px; color: var(--muted); font-size: 16px; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 24px; }
  .card {
    position: relative; display: flex; flex-direction: column; overflow: hidden;
    background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius);
    text-decoration: none; color: inherit;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-6px); border-color: rgba(255, 43, 214, 0.6);
    box-shadow: 0 18px 50px -12px rgba(255, 43, 214, 0.45), 0 0 0 1px rgba(255, 43, 214, 0.25);
    outline: none;
  }
  .cover { position: relative; aspect-ratio: 16 / 9; background: #000; overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
  .card:hover .cover img { transform: scale(1.04); }
  .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(18, 8, 38, 0.95)); }
  .badge {
    position: absolute; top: 12px; left: 12px; z-index: 1; padding: 5px 10px; border-radius: 999px;
    font: 800 10px/1 Orbitron, sans-serif; letter-spacing: 0.12em; color: #1a0533; background: var(--gold);
  }
  .body { display: flex; flex-direction: column; gap: 10px; padding: 4px 20px 20px; flex: 1; }
  .title { margin: 0; font: 800 22px/1.2 Orbitron, sans-serif; letter-spacing: 0.02em; }
  .tagline { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.55; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; padding: 0; list-style: none; }
  .chips li { font-size: 12px; font-weight: 500; color: #d8ccff; padding: 4px 10px; border-radius: 999px; background: rgba(160, 120, 255, 0.12); border: 1px solid var(--line); }
  .play {
    margin-top: auto; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 46px; border-radius: 12px;
    font: 800 14px/1 Orbitron, sans-serif; letter-spacing: 0.14em; color: #fff;
    background: linear-gradient(90deg, #00b8d9, var(--pink));
    box-shadow: 0 0 22px -4px rgba(255, 43, 214, 0.7);
  }
  .play svg { width: 14px; height: 14px; }

  .soon {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 280px; text-align: center;
    border: 1.5px dashed rgba(160, 120, 255, 0.35); border-radius: var(--radius); color: var(--muted); padding: 24px;
  }
  .soon b { font: 800 16px/1.2 Orbitron, sans-serif; color: #d8ccff; letter-spacing: 0.08em; }

  footer { margin-top: 56px; text-align: center; color: var(--muted); font-size: 13px; }
  footer a { color: var(--cyan); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Insert coin</div>
    <h1>Claude Play Arcade</h1>
    <p class="lede">Single-file browser games that load instantly and play on desktop or mobile. Pick a cabinet and start playing.</p>
  </header>

  <main class="grid" id="grid" aria-label="Games"></main>

  <footer>
    <p>Each game is one self-contained HTML file in <code>games/&lt;name&gt;/</code>. Source on <a href="https://github.com/jchandra74/claude_play">GitHub</a>.</p>
  </footer>
</div>

<script>
  // Add new games here: folder under games/, plus cover image and blurb.
  // Optional `path` points the card (link and cover) at a subfolder of games/ instead of the slug.
  const GAMES = [
    {
      slug: 'iron-comet',
      title: 'Iron Comet',
      badge: 'NEW',
      tagline: 'A runaway express, a gang on the roof and a bridge that is out. Leap between carriages, duck the overpasses, kick the gang off and pull the brake in time. Landscape, touch d-pad.',
      tags: ['Action', '8-bit', 'Boss fights', 'Touch d-pad', 'Original music'],
    },
    {
      slug: 'lantern-keeper',
      path: 'lantern-keeper/hd2d',
      title: 'The Lantern Keeper',
      badge: 'HD-2D DEMO',
      tagline: 'A tiny comedic JRPG in HD-2D: pixel-art sprites in a lit 3D diorama with tilt-shift depth of field. Chase a Moth of Unusual Size into the Whisperwood and relight the Great Lantern. Landscape, touch d-pad.',
      tags: ['JRPG', 'HD-2D', 'Turn-based', 'Break & Boost', 'Touch d-pad'],
    },
    {
      slug: 'neon-breaker',
      title: 'Neon Breaker',
      badge: 'NEW',
      tagline: 'Synthwave brick-breaker with boss fights, 9 power-ups, combo chains and a live-synthesised outrun soundtrack.',
      tags: ['Breakout', 'Synthwave', 'Bosses', 'Touch controls', 'Original music'],
    },
  ];

  const grid = document.getElementById('grid');
  const playIcon = '<svg viewBox="0 0 12 14" aria-hidden="true"><path fill="currentColor" d="M0 0l12 7-12 7z"/></svg>';
  for (const g of GAMES) {
    const a = document.createElement('a');
    a.className = 'card';
    const dir = `games/${g.path || g.slug}/`;
    a.href = dir;
    a.setAttribute('aria-label', `Play ${g.title}`);
    a.innerHTML = `
      <div class="cover">
        ${g.badge ? `<span class="badge">${g.badge}</span>` : ''}
        <img src="${dir}cover.jpg" alt="" loading="lazy" width="1280" height="720">
      </div>
      <div class="body">
        <h2 class="title"></h2>
        <p class="tagline"></p>
        <ul class="chips">${g.tags.map(() => '<li></li>').join('')}</ul>
        <span class="play">${playIcon} PLAY</span>
      </div>`;
    a.querySelector('.title').textContent = g.title;
    a.querySelector('.tagline').textContent = g.tagline;
    a.querySelectorAll('.chips li').forEach((li, i) => { li.textContent = g.tags[i]; });
    grid.appendChild(a);
  }
  const soon = document.createElement('div');
  soon.className = 'soon';
  soon.innerHTML = '<b>MORE GAMES SOON</b><span>New cabinets are being wired up.</span>';
  grid.appendChild(soon);
</script>
</body>
</html>
